<style>
/* Layout: identidade Racha dos Campeões — preto e dourado, logo no topo, lista no centro, dois campos lado a lado (empilham no celular). Visual único escuro, por escolha. */
:root{
  --bg:#07090c; --panel:#0B0F14; --line:#1F2937; --slate:#2E3B52; --chalk:#E5E7EB; --white:#FFFFFF; --muted:#8b97aa;
  --grass1:#0d131b; --grass2:#111925; --chalkline:rgba(212,175,55,.38);
  --a:#D4AF37; --a-ink:#0B0F14; --b:#E5E7EB; --b-ink:#0B0F14; --gold:#D4AF37;
  --gold-grad:linear-gradient(180deg,#f8e08e 0%,#D4AF37 45%,#9c7a1c 100%);
  --display:"Montserrat", "Arial Black", system-ui, sans-serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--chalk)}
body{font-family:var(--body);font-weight:500;font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  background:linear-gradient(115deg,transparent 0 62%,rgba(212,175,55,.07) 62% 63%,transparent 63% 66%,rgba(212,175,55,.05) 66% 66.6%,transparent 66.6%) fixed,
  radial-gradient(120% 60% at 50% -10%,#141b26 0%,var(--bg) 60%) fixed,var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:900;font-style:italic;letter-spacing:-.01em}
h2{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.brand img{width:min(360px,78%);height:auto;filter:drop-shadow(0 10px 30px rgba(212,175,55,.25))}
.brand p{margin:0;color:var(--muted);font-size:14px}
.brand.compact{flex-direction:row;justify-content:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand.compact img{width:48px;filter:none}

function connectBroker(ver){return new Promise((res,rej)=>{if(!window.mqtt)return rej({code:"no-lib"});let i=0;
 const next=()=>{if(i>=BROKERS.length)return rej({code:"unavailable"});const url=BROKERS[i++];
  const c=mqtt.connect(url,{protocolVersion:ver||4,clientId:"rc_"+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:2000,keepalive:30});
  let done=false;const t=setTimeout(()=>{if(done)return;done=true;try{c.end(true)}catch(e){}next()},9000);
  c.once("connect",()=>{if(done)return;done=true;clearTimeout(t);res(c)});
  c.once("error",()=>{if(done)return;done=true;clearTimeout(t);try{c.end(true)}catch(e){}next()})};next()})}
async function broker(){if(MQ&&!MQ.disconnecting)return MQ;MQ=await connectBroker();

 MQ.on("connect",()=>{if(S.net&&S.net.startsWith("Sem conexão")){S.net=null;render()}});return MQ}
function readRetained(c,code,ms){return new Promise(res=>{const topic=TOPIC(code)+"/state";let got=null;
 const h=(t,buf)=>{if(t!==topic)return;try{const m=JSON.parse(buf.toString());if(m&&m.d){got=m.d;fin()}}catch(e){}};
 const fin=()=>{clearTimeout(tm);c.removeListener("message",h);res(got)};
 c.on("message",h);c.subscribe(topic,{qos:1});const tm=setTimeout(fin,ms)})}
const snapOf=d=>({exists:!!d,data:()=>jclone(d),metadata:{fromCache:false,hasPendingWrites:false}});
async function roomOf(code,creating){
 if(ROOMS[code])return ROOMS[code];const c=await broker();const T=TOPIC(code);
 const r={code,data:null,ls:[],host:false};
 const emit=()=>{const d=r.data;r.ls.forEach(f=>f(snapOf(d)))};
 if(!creating)r.data=await readRetained(c,code,4000);
 r.host=creating||(r.data&&r.data.hostUid===ME);
 if(r.host){
  const pub=()=>{if(r.data)c.publish(T+"/state",JSON.stringify({d:r.data,at:Date.now()}),{qos:1,retain:true})};
  c.on("message",(t,buf)=>{if(t!==T+"/patch"||!r.data)return;try{const m=JSON.parse(buf.toString());if(isObj(m.d)){r.data=deepMerge(r.data,m.d);emit();pub()}}catch(e){}});
  c.subscribe(T+"/patch",{qos:1});c.on("connect",()=>{c.subscribe(T+"/patch",{qos:1});pub()});
  r.write=(body,full)=>{r.data=full?jclone(body):deepMerge(r.data,jclone(body));emit();pub()};
 } else {
  c.on("message",(t,buf)=>{if(t!==T+"/state")return;try{const m=JSON.parse(buf.toString());if(m&&m.d){r.data=m.d;emit()}}catch(e){}});
  c.subscribe(T+"/state",{qos:1});c.on("connect",()=>c.subscribe(T+"/state",{qos:1}));
  r.write=body=>{c.publish(T+"/patch",JSON.stringify({d:body}),{qos:1})};
 }
 ROOMS[code]=r;return r}

 async get(){if(ROOMS[code]&&ROOMS[code].data)return snapOf(ROOMS[code].data);const c=await broker();return snapOf(await readRetained(c,code,3000))},

  return()=>{live=false;const r=ROOMS[code];if(r)r.ls=r.ls.filter(f=>f!==next)}}}}};

 const scorer=t=>{const L=slots(t);const c=S.lineup[t].map((pk,i)=>{const p=S.pool[pk];const w=Math.max(...ACC[L[i]].map(x=>W[x]||0))*Math.max(1,effOvr(p,L[i])-70);return [p.name,w]});
  const tot=c.reduce((s,x)=>s+x[1],0);let r=Math.random()*tot;for(const [n,w] of c){r-=w;if(r<=0)return n}return c[0][0]};
 const goals=[];for(let k=0;k<ga;k++)goals.push({t:"A",name:scorer("A"),min:1+Math.floor(Math.random()*90)});for(let k=0;k<gb;k++)goals.push({t:"B",name:scorer("B"),min:1+Math.floor(Math.random()*90)});
 goals.sort((x,y)=>x.min-y.min);let pens=null,winner=ga>gb?"A":gb>ga?"B":null;
 if(!winner){const pa=.74+(a-b)/200,pb=.74+(b-a)/200;let x=0,y=0,na=0,nb=0;const seq=[];const kick=t=>{const ok=Math.random()<(t==="A"?pa:pb);seq.push([t,ok]);if(t==="A"){na++;x+=ok}else{nb++;y+=ok}};
 const over=()=>x+(5-na)<y||y+(5-nb)<x;
 for(let r=0;r<5&&!over();r++){kick("A");if(over())break;kick("B")}
 if(!over())while(x===y){kick("A");kick("B")}
 pens={a:x,b:y,seq};winner=x>y?"A":"B"}
 const L=slots(winner),gc={};goals.filter(g=>g.t===winner).forEach(g=>gc[g.name]=(gc[g.name]||0)+1);
 let best=null;S.lineup[winner].forEach((pk,i)=>{const p=S.pool[pk];const sc=(gc[p.name]||0)*10+effOvr(p,L[i]);if(!best||sc>best.sc)best={sc,pk,name:p.name,goals:gc[p.name]||0,ovr:effOvr(p,L[i])}});
 return {a:ga,b:gb,goals,pens,winner,oa:a,ob:b,mvp:best}}
/* partida ao vivo: anima a simulação já sorteada (S.sim), igual para todos os aparelhos */
let LIVE=null;
function rngFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function whistle(n){if(!SND.on)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 for(let k=0;k<n;k++){const d=k===n-1?.5:.16;const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.setValueAtTime(2300,t);o.frequency.linearRampToValueAtTime(2050,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d+.08}}catch(e){}}
function liveEvents(s){
 const R=rngFrom(JSON.stringify([s.a,s.b,s.goals,s.oa,s.ob]));
 const gk=t=>{const L=slots(t);const i=L.indexOf("GOL");const pk=S.lineup[t][i>=0?i:0];return S.pool[pk]?S.pool[pk].name:"o goleiro"};
 const att=t=>{const L=slots(t);const c=S.lineup[t].map((pk,i)=>[S.pool[pk]&&S.pool[pk].name,L[i]]).filter(x=>x[0]&&x[1]!=="GOL"&&x[1]!=="ZAG");return c.length?c[Math.floor(R()*c.length)][0]:"Atacante"};
 const ev=s.goals.map(g=>({min:g.min,t:g.t,k:"goal",name:g.name}));
 const used=new Set(ev.map(e=>e.min));
 const nC=4+Math.floor(R()*3);
 for(let k=0;k<nC;k++){let m=2+Math.floor(R()*87);while(used.has(m)||m===45)m=(m%88)+2;used.add(m);
  const t=R()<(s.oa/(s.oa+s.ob))?"A":"B",o=t==="A"?"B":"A",n=att(t),r=R();
  ev.push({min:m,t,k:"chance",txt:r<.4?`Defesaça de ${gk(o)} no chute de ${n}!`:r<.65?`${n} acerta a trave!`:r<.85?`${n} chuta por cima do gol.`:`Cartão amarelo para ${att(o)}.`,kind:r<.4?"save":r<.65?"post":r<.85?"miss":"card"})}
 return ev.sort((x,y)=>x.min-y.min)}
function startLive(s){if(!s||LIVE)return;
 const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
 const el=document.createElement("div");el.id="live";el.className="live";el.setAttribute("role","dialog");el.setAttribute("aria-label","Partida ao vivo");
 el.innerHTML=`<div class="lv-box">
  <div class="lv-sb"><div class="lvt A"><span>${esc(S.names.A)}</span><b id="lvA">0</b></div><div class="lv-clock"><b id="lvT">0'</b><small id="lvP">1º tempo</small></div><div class="lvt B"><b id="lvB">0</b><span>${esc(S.names.B)}</span></div></div>
  <div class="lv-pitch"><div class="lv-g l"></div><div class="lv-g r"></div><i class="lv-mid"></i><i class="lv-ball" id="lvBall"></i></div>
  <div class="lv-bar"><i id="lvProg"></i></div>
  <div class="lv-pens" id="lvPens" hidden></div>
  <ol class="lv-feed" id="lvFeed" aria-live="polite"></ol>
  <button class="linkbtn lv-skip" id="lvSkip">Pular para o resultado ›</button>
 </div><div class="lv-flash" id="lvFlash" aria-hidden="true"></div><div class="lv-conf" id="lvConf" aria-hidden="true"></div>`;
 document.body.appendChild(el);document.body.classList.add("lv-on");
 const $=id=>document.getElementById(id);const L={stop:false};LIVE=L;
 const end=()=>{if(L.done)return;L.done=true;L.stop=true;LIVE=null;el.classList.add("out");document.body.classList.remove("lv-on");setTimeout(()=>el.remove(),350);
  const f=document.querySelector(".panel.final");if(f){f.classList.add("pop");f.scrollIntoView({block:"start",behavior:"smooth"})}};
 $("lvSkip").onclick=end;
 const sleep=ms=>new Promise(r=>{if(L.stop)return r();setTimeout(r,ms)});
 const feed=(html,cls)=>{const li=document.createElement("li");li.className=cls||"";li.innerHTML=html;$("lvFeed").prepend(li);while($("lvFeed").children.length>5)$("lvFeed").lastChild.remove()};
 const ball=(x,y)=>{const b=$("lvBall");if(b){b.style.left=x+"%";b.style.top=y+"%"}};
 const confetti=t=>{if(rm)return;const c=$("lvConf");const cols=t==="A"?["#60a5fa","#2563eb","#D4AF37","#fff"]:t==="B"?["#f87171","#dc2626","#D4AF37","#fff"]:["#D4AF37","#fff"];
  for(let i=0;i<46;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*.4)+"s";p.style.setProperty("--dx",(Math.random()*120-60)+"px");p.style.setProperty("--r",(Math.random()*720)+"deg");c.appendChild(p);setTimeout(()=>p.remove(),2600)}};
 const flash=async(big,sub,t,ms)=>{const f=$("lvFlash");f.className="lv-flash show "+(t||"");f.innerHTML=`<b>${big}</b>${sub?`<span>${sub}</span>`:""}`;if(!rm)el.classList.add("shake");await sleep(ms);el.classList.remove("shake");f.className="lv-flash"};
 const ev=liveEvents(s);let ga=0,gb=0;
 (async()=>{
  whistle(1);feed(`<b>0'</b> Rola a bola!`,"start");ball(50,50);await sleep(700);
  let i=0;
  for(let m=1;m<=90&&!L.stop;m++){
   $("lvT").textContent=m+"'";$("lvProg").style.width=(m/90*100)+"%";
   if(m===46){$("lvP").textContent="2º tempo";}
   if(m%3===0)ball(20+Math.random()*60,15+Math.random()*70);
   while(i<ev.length&&ev[i].min===m){const e=ev[i++];const atk=e.t==="A"?94:6;
    if(e.k==="goal"){ball(atk-(e.t==="A"?8:-8),48);await sleep(260);ball(atk,50);
     if(e.t==="A")ga++;else gb++;const sc=$(e.t==="A"?"lvA":"lvB");sc.textContent=e.t==="A"?ga:gb;sc.classList.remove("bump");void sc.offsetWidth;sc.classList.add("bump");
     sfx("goal");confetti(e.t);feed(`<b>${m}'</b> ⚽ GOL! ${esc(e.name)} <small>${esc(S.names[e.t])}</small>`,"goal "+e.t);
     await flash("GOOOOL!",`${esc(e.name)} · ${esc(S.names[e.t])}`,e.t,1700);ball(50,50);await sleep(250)}
    else{ball(e.t==="A"?80:20,30+Math.random()*40);feed(`<b>${m}'</b> ${esc(e.txt)}`,"ch "+e.kind);if(e.kind!=="card")sfx("flip");await sleep(650)}}
   if(m===45){whistle(2);feed(`<b>45'</b> Intervalo · ${ga} × ${gb}`,"half");$("lvP").textContent="Intervalo";ball(50,50);await sleep(1100)}
   await sleep(m>80&&Math.abs(ga-gb)<=1?150:95)}
  if(L.stop)return;
  whistle(3);
  if(s.pens){$("lvP").textContent="Pênaltis";feed(`<b>90'</b> Fim do tempo normal: ${ga} × ${gb}. Vai para os pênaltis!`,"half");await flash("PÊNALTIS!","",null,1300);
   const P=$("lvPens");P.hidden=false;const seq=s.pens.seq||null;
   P.innerHTML=`<div class="pr A"><span>${esc(S.names.A)}</span><div id="pkA"></div><b id="pkAs">0</b></div><div class="pr B"><span>${esc(S.names.B)}</span><div id="pkB"></div><b id="pkBs">0</b></div>`;
   if(seq){let x=0,y=0;for(const [t,ok] of seq){if(L.stop)return;const d=document.createElement("i");d.className="pk "+(ok?"ok":"no");d.textContent=ok?"✓":"✕";
     ball(t==="A"?88:12,50);await sleep(500);$(t==="A"?"pkA":"pkB").appendChild(d);if(ok){t==="A"?x++:y++;sfx("pick")}else sfx("flip");$("pkAs").textContent=x;$("pkBs").textContent=y;await sleep(450)}}
   else{$("pkAs").textContent=s.pens.a;$("pkBs").textContent=s.pens.b;await sleep(900)}
   $("lvA").textContent=`${s.a} (${s.pens.a})`;$("lvB").textContent=`(${s.pens.b}) ${s.b}`}
  else{feed(`<b>90'</b> Fim de jogo!`,"half")}
  if(L.stop)return;
  $("lvP").textContent="Fim de jogo";confetti(s.winner);
  await flash(`VITÓRIA DE ${esc(S.names[s.winner]).toUpperCase()}`,s.mvp?`Craque da partida: ${esc(s.mvp.name)}`:"",s.winner,2200);
  end()})();
}

  if(P.step===0)body=`<span class="label">Quem começa?</span><h2><span class="tagA">${esc(A)}</span>, você quer…</h2>

   ${controls("A")?(S.play==="local"?`<p class="note">${esc(B)} não pode olhar.</p>`:"")+nums("A"):`<p class="note">Aguardando ${esc(A)} escolher o número.</p>`}`;
  else if(P.step===2)body=`<span class="label">Número de ${esc(A)} escondido</span><h2><span class="tagB">${esc(B)}</span>, escolha seu número</h2>

  else{const s=P.numA+P.numB,par=s%2===0,win=(par===(P.choice==="par"))?"A":"B";
   const hand=(n,t)=>`<div class="hand-n ${t}"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 58c-6-4-10-12-10-20V26a4 4 0 0 1 8 0v8V12a4 4 0 0 1 8 0v18V8a4 4 0 0 1 8 0v22V12a4 4 0 0 1 8 0v20l3-6a4 4 0 0 1 7 4l-7 16c-3 8-9 12-17 12z" fill="currentColor"/></svg><b>${n}</b><small>${esc(S.names[t])}</small></div>`;

   <h2><span class="tag${win}">${esc(S.names[win])}</span> começa escolhendo</h2>
   ${isHost()?`<button class="btn" data-act="startDraft" data-first="${win}">Começar o racha →</button>`:`<p class="note">Aguardando ${esc(A)} começar.</p>`}`}
 }

}

function hand(t){const c=S.cards[t];
 if(!c)return `<span class="minicard wait">Carta no 5º jogador</span>`;
 const C=CARDS[c.id];if(c.used)return `<span class="minicard used">${C.n}. ${C.t}</span><span class="note">${c.lost?"sem jogada":"usada"}</span>`;
 if(!controls(t)||isBot(t))return `<span class="minicard">Carta surpresa</span><span class="note">sendo usada…</span>`;
 return `<span class="minicard">Carta surpresa</span>`+(!S.cmode&&!S.reveal?`<button class="btn small" data-use="${t}">Usar carta agora</button>`:"")}

function field(t,interactive){
 const rows=FORMS[S.form[t]];let idx=0;const cur=turn();const M=S.cmode;
 const bonus=M&&M.type==="bonus";
 const canTarget=interactive&&!S.reveal&&S.sel!==null&&controls(t)&&(bonus?M.t===t:(!M&&!S.pending&&cur===t));
 const swapOn=interactive&&M&&M.type==="troca"&&((M.step===0&&t===M.t)||(M.step===1&&t!==M.t));

 return `<div class="field-wrap ${t}">
  <div class="field-title"><h3>${esc(S.names[t])}${S.play==="online"&&S.seat===t?` <small class="you">você</small>`:""}${showOvr()?` <span class="tovr cnt" data-to="${teamOvr(t)}">${teamOvr(t)}</span>`:""}</h3>${interactive&&canArrange(t)?`<span class="fsel"><select data-fchange="${t}" aria-label="Formação de ${esc(S.names[t])}">${Object.keys(FORMS).map(f=>`<option ${S.form[t]===f?"selected":""}>${f}</option>`).join("")}</select><span class="label">${count(t)}/11</span></span>`:`<span class="label">${S.form[t]} · ${count(t)}/11</span>`}</div>
  ${interactive?`<div class="hand">${hand(t)}</div>`:""}
  <div class="pitch"><div class="lines">${rows.map(r=>`<div class="lr">${r.map(lbl=>({lbl,i:idx++})).reverse().map(({lbl,i})=>{const pk=S.lineup[t][i];
   if(pk!==null&&pk!==undefined){const p=S.pool[pk];const fr=S.lastFill&&S.lastFill.t===t&&S.lastFill.i===i;
    const ch=M&&M.type==="troca"&&M.step===1&&t===M.t&&M.mine===i;
    const pn=pen(p,lbl),off=pn>0;const k=++OVK;const ov=showOvr()?`<span class="ov ${off?"off":""} ${ANIM?"rev":""}" style="animation-delay:${ANIM?k*90:0}ms" title="Overall na campanha${off?" (−"+pn+" improvisado)":""}">${effOvr(p,lbl)}</span>`:"";const fg=flagOf(p);const inner=`${ov}${fg?`<span class="fl" aria-hidden="true">${fg}</span>`:""}<span class="dot ${off?"off":""}" style="${shirt(p)}">${esc(initials(p.name))}</span><span class="sn">${esc(p.name)}</span><span class="sp ${off?"off":""}">${lbl}</span>`;
    if(swapOn)return `<button class="slot filled swap" data-swap="${i}" data-team="${t}" title="${esc(p.name)}">${inner}</button>`;
    if(arr&&S.move&&S.move.t===t)return `<button class="slot filled mv ${S.move.i===i?"chosen":""}" data-mv="${i}" data-team="${t}" title="Trocar com ${esc(p.name)}">${inner}</button>`;
    return `<button class="slot filled ${fr?"fresh":""} ${ch?"chosen":""}" data-info="${i}" data-team="${t}" title="${esc(p.name)}">${inner}</button>`}
   if(arr&&S.move&&S.move.t===t)return `<button class="slot target" data-mv="${i}" data-team="${t}" aria-label="Mover para ${lbl}"><span class="dot">${lbl}</span></button>`;
   if(canTarget){const sp=S.pool[S.sel],q=pen(sp,lbl);return `<button class="slot target ${q===0?"good":q<=NEARPEN?"near":"bad"}" data-slot="${i}" data-team="${t}" aria-label="Colocar em ${lbl}${q?" (improvisado −"+q+")":""}"><span class="dot">${lbl}</span>${q?`<span class="pq">−${q}</span>`:""}</button>`}
   return false?""
     :`<div class="slot"><div class="dot">${lbl}</div></div>`}).join("")}</div>`).join("")}</div></div>
 </div>`;
}

 <div class="grid2">${["A","B"].map(t=>field(t,inter).replace('class="field-wrap','class="'+(v===t?"":"mhide ")+'field-wrap')).join("")}</div>`}
function infoSheet(){if(!S.info)return "";const {t,i}=S.info;const pk=S.lineup[t]&&S.lineup[t][i];if(pk==null){S.info=null;return ""}
 const p=S.pool[pk],lbl=slots(t)[i],sq=SQUADS.find(s=>s.id===p.sq),pn=pen(p,lbl),off=pn>0,c=clubCol(p);
 return `<div class="overlay" role="dialog" aria-label="${esc(p.name)}"><div class="sheet">

  ${(()=>{const o=SQUADS.filter(s=>s.id!==p.sq&&s.p.split(",").some(e=>{const [n,ps]=e.replace(/^\*/,"").split(":");return n===p.name&&ps===p.pos})).sort((x,y)=>yrOf(x.id)-yrOf(y.id)).map(s=>s.n);return o.length?`<dt>Também em</dt><dd>${o.map(esc).join(", ")}</dd>`:""})()}
  <dt>Overall</dt><dd>${showOvr()?`<b class="mo">${effOvr(p,lbl)}</b>${off?` (${p.ovr} na posição dele)`:""}`:"aparece quando os dois times fecharem"}</dd></dl>
  <div class="row" style="justify-content:flex-end">${canArrange(t)&&!S.cmode?`<button class="btn ghost" data-act="startMove">Mudar de posição</button>`:""}<button class="btn" data-act="closeInfo">Fechar</button></div>
 </div></div>`}
function presence(t){if(S.play!=="online"||!S.seen)return "";const on=Date.now()-(S.seen[t]||0)<45000;return `<i class="pres ${on?"on":""}" title="${on?"online":"offline"}"></i>`}
function reacts(){return S.play==="online"&&S.seat?`<div class="reacts" aria-label="Reações">${["👏","🔥","😂","😱","🤡"].map(e=>`<button data-react="${e}" aria-label="Reagir ${e}">${e}</button>`).join("")}</div>`:""}
function scoreboard(){

function banner(t){
 const M=S.cmode,sel=S.sel!==null?S.pool[S.sel]:null,cancel="";
 if(M){const N=esc(S.names[M.t]);let msg="";
  if(M.type==="troca")msg=M.step===0?`<span>Troca · ${N}: toque num jogador seu</span>${cancel}`:`<span>Troca · agora toque no jogador de ${esc(S.names[other(M.t)])} que vem para o seu time</span>${cancel}`;

  else if(M.card==="surpresa")msg=`<span>Jogador surpresa de ${N}: ${esc(sel.name)} (${sel.pos})</span><span>Toque numa posição do campo</span>`;
  else msg=sel?`<span>Mesma posição · ${esc(sel.name)}</span><span>Toque numa posição do campo</span>`:`<span>Mesma posição · ${N}: escolha um ${M.pos} da lista</span>`;
  return `<div class="turn ${M.t}">${msg}</div>`}

  ?`<div class="turn ${p}"><span>${N} tirou uma cartinha surpresa</span><span>Use agora: a carta não pode ser guardada</span></div>`
  :`<div class="turn ${p} waiting"><span>${N} tirou uma cartinha surpresa</span><span>Aguardando a carta ser usada…</span></div>`}
 if(S.move){const p=S.pool[S.lineup[S.move.t][S.move.i]];return `<div class="turn ${S.move.t}"><span>Mover ${esc(p.name)}: toque em outra posição do seu campo</span><button class="btn small" data-act="cancelMove">Cancelar</button></div>`}
 if(S.msg){const m=S.msg;S.msg=null;return `<div class="turn ${t}"><span>${esc(m)}</span><span>Escolha um jogador normalmente</span></div>`}
 if(t===null)return `<div class="donecta"><p>Times fechados! O overall de cada jogador foi revelado.</p><button class="btn big" data-act="toVote">▶ Simular partida</button></div>`;
 if(!controls(t))return `<div class="turn ${t} waiting"><span>Vez de ${esc(S.names[t])}</span><span>${isBot(t)?"O robô está pensando…":"Aguardando a escolha…"}</span></div>`;

function draft(){
 const t=turn(),M=S.cmode;
 const lockPos=M&&M.type==="bonus"&&M.card==="mesma"?M.pos:null;
 const filter=lockPos||S.filter;
 const qn=(S.q||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 const list=S.pool.filter(p=>!p.taken&&(filter==="ALL"||p.pos===filter)&&(!qn||p.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(qn)));
 const left=S.pool.filter(p=>!p.taken).length;
 const pickOff=!!S.reveal||(M?(M.type!=="bonus"||M.card==="surpresa"):(!!S.pending||t===null||!controls(t)));
 const plBtn=(p,attr)=>`<button class="pl" ${attr} ${pickOff&&!attr.startsWith("data-gk")?"disabled":""} title="${pdet(p).map(x=>POSNAME[x]).join(", ")}"><span class="pos">${pdet(p).join("/")}</span><span class="nm"><b>${esc(p.name)}</b><small><i class="cdot" style="background:${clubCol(p)[0]}"></i>${p.tags.join(" · ")}</small></span></button>`;

  ?`<section class="panel"><div class="pool-head"><span class="label">Goleiros disponíveis · ${M.list.length}</span></div>

  :`<section class="panel" id="poolPanel">
  <div class="pool-head"><span class="label">Disponíveis · ${left}</span>
   <input id="poolSearch" class="search" type="search" placeholder="Buscar jogador" value="${esc(S.q||"")}" autocomplete="off" aria-label="Buscar jogador">
   <div class="filters" role="group" aria-label="Filtrar por posição">${["ALL",...POS_ORDER].map(f=>`<button data-filter="${f}" aria-pressed="${filter===f}" ${lockPos?"disabled":""}>${f==="ALL"?"Todos":f}</button>`).join("")}</div></div>
  <div class="pool">${list.map(p=>plBtn(p,`data-pick="${p.i}" aria-pressed="${S.sel===p.i}"`)).join("")||`<p class="note">${left?"Ninguém encontrado.":"Todos os jogadores foram escolhidos."}</p>`}</div>
  ${GAMES>0&&!S.legend?`<button class="linkbtn qbtn" data-act="legend" aria-label="O que significam as siglas">? Siglas das posições</button>`:`<p class="legend">GOL goleiro · LD/LE laterais · ZAG zagueiro · VOL volante · MC meio-campo · MEI meia · PD/PE pontas · CA centroavante</p>`}

 let ov="";

  ov=S.peek
  ?`<div class="overlay" role="dialog" aria-label="Carta de ${N}"><div class="reveal">

   <p class="note">${usable(r)?"A cartinha é usada na hora, mesmo fora da sua vez.":"Agora não tem jogada possível com essa carta, então ela se perde."}</p>
  </div></div>`
  :`<div class="overlay" role="dialog" aria-label="Carta surpresa"><div class="reveal">
   <span class="label" style="color:var(--chalk)">${N} escolheu o 5º jogador e tirou uma cartinha surpresa</span>
   ${S.cards[r].seen?`${cardBack(false)}<div class="row" style="justify-content:center"><button class="btn" data-act="flip">Virar carta</button></div>`
    :`<h2 style="font-size:24px;text-transform:uppercase">Escolha uma cartinha</h2>
   <div class="pick4">${(()=>{const nx=S.cards[r].nx||(S.cards[other(r)]?[`${S.names[other(r)]} já tirou`]:[]);const off=4-nx.length;return [0,1,2,3].map(k=>k>=off
     ?`<div class="pk4 gone" aria-hidden="true">${cardBack(true)}<small>${esc(nx[k-off])}</small></div>`
     :`<button class="pk4" data-act="flip" aria-label="Cartinha ${k+1}">${cardBack(true)}</button>`).join("")})()}</div>`}
   <p class="note">${S.play==="local"?`Só ${N} pode olhar.`:"Só você vê a sua carta."} As cartas são diferentes para cada time.</p>
  </div></div>`}
 const foot=S.play==="online"
  ?`<button class="btn ghost small" data-act="leave">Sair da sala</button>`
  :`${S.play==="local"?`<button class="btn ghost small" data-act="undo" ${S.history.length&&!M?"":"disabled"}>↶ Desfazer última escolha</button>`:""}<button class="btn ghost small" data-act="restart">Recomeçar</button>`;
 return `${scoreboard()}${banner(t)}${S.net?`<p class="note warn">${esc(S.net)}</p>`:""}${t===null&&!M&&!S.pending?"":poolSec}
 ${reacts()}${fieldsBlock(true)}
 <div class="row">${foot}</div>${ov}`;

function vote(){

 const on=S.play==="online",bot=S.play==="bot";
 const V=on?{A:Object.values(S.vmap||{}).filter(v=>v==="A").length,B:Object.values(S.vmap||{}).filter(v=>v==="B").length}:S.votes;

 const s=S.sim;

  ${s.mvp&&S.pool[s.mvp.pk]?`<div class="mvp"><span class="dot big" style="${shirt(S.pool[s.mvp.pk])}">${esc(initials(s.mvp.name))}</span><div><span class="label">Craque da partida</span><b>${esc(s.mvp.name)}</b><small>${s.mvp.goals?s.mvp.goals+(s.mvp.goals>1?" gols":" gol")+" · ":""}overall ${s.mvp.ovr} · ${esc((S.pool[s.mvp.pk].tags||[])[0]||"")}</small></div></div>`:""}
 </section>`:`<section class="panel"><p class="note">Simulando a partida…</p></section>`;
 let res="";
 if(S.closed){res=V.A===V.B?`<div class="winner"><span class="label">${V.A} × ${V.B}</span><div class="big">Empate</div></div>`
   :(()=>{const w=V.A>V.B?"A":"B";return `<div class="winner"><span class="label">${V.A} × ${V.B} nos votos</span><div class="big">${esc(S.names[w])}</div><p class="note">montou o melhor time na opinião da galera.</p></div>`})()}
 const canClose=!on||S.seat==="A";
 const voting=bot?"":`<section class="panel" style="display:flex;flex-direction:column;gap:12px">
  <h2 style="font-size:24px;text-transform:uppercase">E vocês, acham o quê?</h2>
  <p class="note">${on?"Cada pessoa com o jogo aberto vota uma vez. Dá para mudar o voto até encerrar.":"Cada amigo toca uma vez no time que acha melhor."}</p>
  ${S.closed?res:`<div class="vote">${["A","B"].map(t=>`<button class="vbtn ${t} ${mine===t?"mine":""}" data-vote="${t}" ${on&&!ME?"disabled":""}><span class="n">${V[t]}</span>${mine===t?"Seu voto: ":"+1 para "}${esc(S.names[t])}</button>`).join("")}</div>
  <div class="row">${canClose?`<button class="btn small" data-act="close" ${V.A+V.B?"":"disabled"}>Encerrar votação</button>`:`<span class="note">${esc(S.names.A)} encerra a votação.</span>`}${on?"":`<button class="linkbtn" data-act="zero">Zerar votos</button>`}</div>`}
 </section>`;
 const canPub=!on||S.seat==="A";
 const primary=on?(S.seat==="A"?`<button class="btn" data-act="again">Novo racha</button>`:""):`<button class="btn" data-act="again">Jogar de novo</button>`;
 const links=[canPub?`<button class="linkbtn" data-act="publish">${S.publishedId?"Ver no mural":"Publicar no mural (24h)"}</button>`:"",
  `<button class="linkbtn" data-act="replay">Ver o jogo de novo</button>`,on?`<button class="linkbtn" data-act="leave">Sair da sala</button>`:`<button class="linkbtn" data-act="backDraft">Voltar à escolha</button>`,`<a class="linkbtn sug" href="https://carludix.com/contato/?jogo=Racha%20dos%20Campe%C3%B5es" target="_blank" rel="noopener">💡 Enviar sugestão</a>`].join("");
 return `${scoreboard()}${sim}
 <div class="endact">${primary}<div class="links">${links}</div></div>
 ${voting}${reacts()}
 ${fieldsBlock(false)}
 ${left.length?`<section class="panel"><span class="label">Sobraram (${left.length})</span><div class="leftover" style="margin-top:8px">${left.map(p=>`<span>${esc(p.name)}</span>`).join("")}</div></section>`:""}`;
}

function render(){
 const app=document.getElementById("app");
 const head=S.screen==="home"
  ?`<div class="carlrow"><a class="carl" href="https://carludix.com/">← CARLUDIX</a></div><header class="brand"><h1 style="margin:0"><img src="${LOGO_MAIN}" alt="Racha dos Campeões" width="640" height="542"></h1><p>Tire o time com os titulares das finais que valeram taça.</p></header>`
  :`<header class="brand compact"><img src="${LOGO_ICON}" alt="" width="160" height="160"><b><span>Racha dos</span> Campeões</b>${S.room?`<span class="roomtag">Sala ${esc(S.room)}</span>`:""}<a class="carl${S.room?"":" push"}" href="https://carludix.com/">← CARLUDIX</a></header>`;
 const screens={home,setup,join,lobby,start:startScreen,draft,vote,mural};
 OVK=0;ANIM=false;
 if((S.screen==="draft"||S.screen==="vote")&&showOvr()&&!S.ovrShown){S.ovrShown=true;ANIM=true;setTimeout(()=>sfx("reveal"),300)}
 const goLive=S.screen==="vote"&&S.sim&&!S.simShown;if(goLive)S.simShown=true;
 const ae=document.activeElement,focusId=ae&&ae.id&&ae.tagName==="INPUT"?ae.id:null,caret=focusId?ae.selectionStart:null;
 app.innerHTML=head+(screens[S.screen]||home)()+`<nav class="sitelinks" aria-label="CARLUDIX"><a href="https://carludix.com/">CARLUDIX</a><a href="https://carludix.com/privacidade/">Privacidade</a><a href="https://carludix.com/contato/">Contato</a></nav><p class="ver">Racha dos Campeões · versão ${VERSION}</p>`+(S.screen==="draft"||S.screen==="vote"?infoSheet():"")+onbSheet();
 if(goLive)setTimeout(()=>startLive(S.sim),60);
 if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(caret,caret)}catch(e){}}}
 if(S.screen==="draft"&&S.news&&S.news!==S._newsSeen){if(S._newsSeen!==undefined&&S.newsBy&&(!controls(S.newsBy)||isBot(S.newsBy))&&!S.reveal)toast(S.news);S._newsSeen=S.news}
 if(S.scroll&&window.innerWidth<760){const k=S.scroll;requestAnimationFrame(()=>{const el=k==="field"?document.querySelector(".field-wrap:not(.mhide) .pitch"):document.getElementById("poolPanel");if(el)el.scrollIntoView({behavior:"smooth",block:k==="field"?"center":"start"})})}
 if(ANIM){const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;if(!rm)document.querySelectorAll(".cnt").forEach(el=>{const to=+el.dataset.to;el.textContent="?";
  setTimeout(()=>{let v=Math.max(50,to-20);el.textContent=v;const iv=setInterval(()=>{v++;el.textContent=v;if(v>=to){clearInterval(iv);el.classList.add("hit")}},40)},11*90+400)})}
 S.scroll=null;
 S.lastFill=null;
 scheduleBot();
}

/* eventos */
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
 const act=d.act;
 if(d.play){S.play=d.play;S.room=null;S.seat=S.play==="online"?"A":null;S.hostEditing=false;S.net=null;
  if(S.play==="bot")S.names.B="Robô";else if(S.names.B==="Robô"||S.names.B==="Aguardando…")S.names.B="Time Prata";
  S.screen="setup"}
 else if(d.comp){S.comp=d.comp}
 else if(d.squad){const i=S.selected.indexOf(d.squad);S.setupMsg=null;
  if(i>=0)S.selected.splice(i,1);else{if(!S.multi&&S.selected.length>=2){const out=S.selected.shift();S.setupMsg=`Partida com 2 campeões: ${SQUADS.find(s=>s.id===out).n} saiu. Para usar mais, toque em "Liberar mais".`}S.selected.push(d.squad)}}
 else if(d.multi!==undefined){S.multi=d.multi==="1";S.setupMsg=null;if(!S.multi&&S.selected.length>2)S.selected=S.selected.slice(-2)}
 else if(d.view){S.view=d.view}
 else if(d.info!==undefined){S.info={t:d.team,i:+d.info}}
 else if(d.react){if(S.play==="online"&&DB&&S.room){const r={by:S.seat||"V",e:d.react,at:Date.now()};S.reactAt=r.at;DB.doc("rooms/"+S.room).update({react:r}).catch(()=>{});toast("Você: "+d.react)}return}
 else if(d.order){S.order=d.order}
 else if(d.start){S.start=d.start}
 else if(d.choice){if(!controls("A"))return;S.poi.choice=d.choice;S.poi.step=1;commit()}
 else if(d.num!==undefined){const who=d.who;if(!controls(who))return;
  if(who==="A"){S.poi.numA=+d.num;if(S.play==="bot"){S.poi.numB=Math.floor(Math.random()*6);S.poi.step=3}else S.poi.step=2}
  else{S.poi.numB=+d.num;S.poi.step=3}
  commit()}
 else if(d.filter){S.filter=d.filter}
 else if(d.pick!==undefined){const i=+d.pick,M=S.cmode;if(S.reveal||(S.pending&&!M))return;S.move=null;
  if(M&&(M.type!=="bonus"||M.card==="surpresa"))return;
  if(M&&M.card==="mesma"&&S.pool[i].pos!==M.pos)return;
  if(!M&&!controls(turn()))return;
  S.sel=S.sel===i?null:i;if(S.sel!==null)S.scroll="field"}
 else if(d.slot!==undefined){const t=d.team,i=+d.slot,M=S.cmode,bonus=M&&M.type==="bonus";
  if(S.reveal||S.sel===null||S.lineup[t][i]!==null||!controls(t))return;
  if(bonus?M.t!==t:(M||S.pending||turn()!==t))return;
  const pk=S.sel;S.sel=null;S.filter="ALL";
  if(bonus){S.cmode=null;place(t,pk,i,M.card)}else place(t,pk,i,null);
  S.scroll="pool";commit()}
 else if(d.mv!==undefined){const t=d.team,i=+d.mv;if(!canArrange(t))return;
  if(!S.move){if(S.lineup[t][i]===null)return;S.move={t,i}}
  else if(S.move.t!==t||S.move.i===i){S.move=null}
  else{const a=S.move.i,L=S.lineup[t];[L[a],L[i]]=[L[i],L[a]];S.move=null;S.history=[];S.lastFill={t,i};
   commitArrange(t)}}
 else if(d.swap!==undefined){const M=S.cmode,i=+d.swap;if(!M||M.type!=="troca")return;
  if(M.step===0){M.mine=i;M.step=1}else{S.cmode=null;doSwap(M.t,M.mine,i);commit("both")}}
 else if(d.gk!==undefined){const M=S.cmode;if(!M||M.type!=="goleiro")return;S.cmode=null;doGoleiro(M.t,M.list[+d.gk]);commit()}
 else if(d.use){if(S.pending===d.use&&!S.cmode&&controls(d.use)){S.reveal=d.use;S.peek=true}}
 else if(d.peek){if(!S.cmode&&!S.reveal&&controls(d.peek)){S.reveal=d.peek;S.peek=false}}
 else if(d.mvote){muralVote(d.id,d.mvote);return}
 else if(d.vote){if(S.play==="online"){if(!ME||!DB)return;S.vmap={...(S.vmap||{}),[ME]:d.vote};const ref=DB.doc("rooms/"+S.room);
   writeQ=writeQ.then(()=>ref.update({vmap:{[ME]:d.vote}})).catch(()=>{S.net="Não deu para registrar o voto.";render()})}
  else S.votes[d.vote]++}
 else if(act){const A={
  home(){S.screen="home";S.net=null;try{if(location.hash.startsWith("#mural"))history.replaceState(null,"",location.pathname+location.search)}catch(e){}},
  mural(){S.net=null;openMural(null);return "norender"},
  publish(){publishMural();return "norender"},
  mcopy(){const id=d.id,u=muralLink(id);MUR.copied=id;try{navigator.clipboard.writeText(u).then(()=>render(),()=>{b.textContent=u})}catch(e){b.textContent=u}return "norender"},
  toJoin(){S.screen="join";S.joinErr=null},
  join(){joinRoom()},
  rejoin(){const s=lsGet();if(!s)return;S.play="online";S.room=s.code;S.seat=s.seat;subscribe(s.code)},
  random(){const ids=SQUADS.map(s=>s.id);let pick=[];for(let tries=0;tries<50;tries++){pick=[];while(pick.length<2){const r=ids[Math.floor(Math.random()*ids.length)];
   const nm=SQUADS.find(s=>s.id===r).n;if(!pick.some(p=>SQUADS.find(s=>s.id===p).n===nm))pick.push(r)}S.selected=pick;if(poolSize()>=22)break}
   S.comp=SQUADS.find(s=>s.id===pick[0]).c[0]},
  setupGo(){if(S.play==="online"){
    if(S.hostEditing){S.hostEditing=false;Object.assign(S,gameReset());S.screen="start";commit("both")}
    else createRoom();return}
   Object.assign(S,gameReset());S.screen="start"},
  cancelEdit(){S.hostEditing=false;subscribe(S.room)},
  lobbyGo(){S.poi={step:0,choice:null,numA:null,numB:null};S.coin=null;S.screen="start";commit()},
  shareInvite(){const u=inviteLink(S.room);const done=m=>{S.shareMsg=m;render();setTimeout(()=>{S.shareMsg=null;render()},2500)};
   const copy=()=>{try{navigator.clipboard.writeText(u).then(()=>done("Link copiado!"),()=>{const el=document.getElementById("inviteLink");el.select();done("Selecione e copie o link")})}catch(e){done("Selecione e copie o link")}};
   if(navigator.share&&STANDALONE){navigator.share({title:"Racha dos Campeões",text:"Entra na minha sala do Racha dos Campeões:",url:u}).catch(copy)}else copy();return "norender"},
  copyCode(){const c=S.room;try{navigator.clipboard.writeText(c).then(()=>{b.textContent="Copiado!"},()=>{b.textContent=c})}catch(e){b.textContent=c}return "norender"},
  leave(){leaveRoom()},
  back(){S.screen="setup"},
  coin(){S.coin=Math.random()<.5?"A":"B";commit()},
  startDraft(){S.first=d.first;startDraft();commit("both")},
  undo(){if(S.cmode||S.play!=="local")return;const h=S.history.pop();if(!h)return;S.lineup[h.t][h.i]=null;S.pool[h.pk].taken=null;S.picks--;S.sel=null},
  keep(){},
  flip(){S.peek=true;S.cards[S.reveal].seen=true;sfx("flip")},
  useNow(){const r=S.reveal;S.reveal=null;S.peek=false;if(S.pending===r)useCard(r)},
  cancelMove(){S.move=null},
  cancelMode(){},
  restart(){S.screen="setup"},
  legend(){S.legend=true},
  replay(){if(S.sim)startLive(S.sim);return "norender"},
  toVote(){S.screen="vote";if(!S.sim){S.sim=simulate();GAMES++;try{localStorage.setItem("racha_games",String(GAMES))}catch(e){}}S.view=null;window.scrollTo({top:0});if(S.play==="online")commit()},
  startMove(){if(S.info&&canArrange(S.info.t)){S.move={t:S.info.t,i:S.info.i}}S.info=null},
  closeInfo(){S.info=null},
  sound(){SND.on=!SND.on;try{localStorage.setItem("racha_snd",SND.on?"1":"0")}catch(e){}if(SND.on)sfx("pick")},
  howto(){S.onb=0},
  onbNext(){S.onb=Math.min(2,(S.onb||0)+1)},
  onbPrev(){S.onb=Math.max(0,(S.onb||0)-1)},
  onbClose(){S.onb=null;try{localStorage.setItem("racha_onb","1")}catch(e){}},
  backDraft(){S.screen="draft";S.closed=false},
  close(){S.closed=true;commit()},
  zero(){S.votes={A:0,B:0}},
  again(){if(S.play==="online"){S.hostEditing=true;S.screen="setup";return}Object.assign(S,gameReset());S.screen="setup"}
 };const r=A[act]?.();if(r==="norender")return}
 else return;
 render();
});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="poolSearch"){S.q=el.value;render();return}if(el.dataset.name){S.names[el.dataset.name]=el.value||(el.dataset.name==="A"?"Time Ouro":"Time Prata")}
 if(el.id==="joinCode"){el.value=el.value.toUpperCase().replace(/[^A-Z]/g,"")}});
document.addEventListener("toggle",e=>{if(e.target&&e.target.id==="custom")S.custOpen=e.target.open},true);
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.form){S.form[el.dataset.form]=el.value;render()}
 if(el.dataset.fchange){const t=el.dataset.fchange;if(!canArrange(t))return render();changeForm(t,el.value);commitArrange(t);render()}});

async function connect(){
 try{
  if(!window.claude||!window.claude.use){STANDALONE=true;
   if(window.mqtt){DB=mqttDB;ME=myId();CANWRITE=true;S.dbState="on";if(S.play==="online"&&S.room)subscribe(S.room)}else S.dbState="off";
   return render()}
  DB=await window.claude.use("db");USER=await window.claude.use("user");
  ME=USER?await USER.id():null;CANWRITE=USER?await USER.can("data.write"):null;
  S.dbState=DB&&ME&&CANWRITE!==false?"on":"off";
  if(S.play==="online"&&S.room&&S.dbState==="on")subscribe(S.room);
 }catch(e){S.dbState="off"}
 render();
}
function start(data){S=data&&data.S?data.S:fresh();S.dbState=S.dbState||"wait";
 try{if(!localStorage.getItem("racha_onb")&&!(location.hash||"").startsWith("#"))S.onb=0}catch(e){}
 render();
 connect().then(()=>{const h=location.hash||"";const m=h.match(/^#mural-([a-z0-9]+)$/);if(m)return openMural(m[1]);
  const r=h.match(/^#sala-([A-Za-z]{4})$/);if(r&&!(S.room&&S.room===r[1].toUpperCase())){S.joinCode=r[1].toUpperCase();S.invited=true;S.screen="join";S.joinErr=null;render()}})}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body></html>

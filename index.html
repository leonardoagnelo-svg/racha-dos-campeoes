<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Racha dos Campeões</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
<style>
/* Layout: identidade Racha dos Campeões — preto e dourado, logo no topo, lista no centro, dois campos lado a lado (empilham no celular). Visual único escuro, por escolha. */
:root{
  --bg:#07090c; --panel:#0B0F14; --line:#1F2937; --slate:#2E3B52; --chalk:#E5E7EB; --white:#FFFFFF; --muted:#8b97aa;
  --grass1:#0d131b; --grass2:#111925; --chalkline:rgba(212,175,55,.38);
  --a:#D4AF37; --a-ink:#0B0F14; --b:#E5E7EB; --b-ink:#0B0F14; --gold:#D4AF37;
  --gold-grad:linear-gradient(180deg,#f8e08e 0%,#D4AF37 45%,#9c7a1c 100%);
  --display:"Montserrat", "Arial Black", system-ui, sans-serif;
  --body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--chalk)}
body{font-family:var(--body);font-weight:500;font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  background:linear-gradient(115deg,transparent 0 62%,rgba(212,175,55,.07) 62% 63%,transparent 63% 66%,rgba(212,175,55,.05) 66% 66.6%,transparent 66.6%) fixed,
  radial-gradient(120% 60% at 50% -10%,#141b26 0%,var(--bg) 60%) fixed,var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:900;font-style:italic;letter-spacing:-.01em}
h2{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.brand img{width:min(360px,78%);height:auto;filter:drop-shadow(0 10px 30px rgba(212,175,55,.25))}
.brand p{margin:0;color:var(--muted);font-size:14px}
.brand.compact{flex-direction:row;justify-content:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand.compact img{width:48px;filter:none}
.brand.compact b{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(20px,3.6vw,28px);line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand.compact b span{background:linear-gradient(180deg,#fff,#c9cdd4);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.panel{background:linear-gradient(160deg,#0f141b,var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px}
.btn{background:var(--gold-grad);color:#0B0F14;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em;padding:11px 22px;font-size:15px;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 18px rgba(212,175,55,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
.btn.ghost{background:linear-gradient(180deg,#1a222e,#0e131a);color:var(--chalk);box-shadow:inset 0 0 0 1px var(--slate)}
.btn.small{padding:7px 14px;font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* setup */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.teams{grid-template-columns:1fr}}
.teamcard{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;border:2px solid}
.teamcard.A{border-color:var(--a)} .teamcard.B{border-color:var(--b)}
.teamcard input,.teamcard select{background:var(--bg);border:1px solid var(--line);color:var(--chalk);border-radius:6px;padding:9px 10px;font:inherit;width:100%;box-sizing:border-box}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{background:var(--chalk);color:var(--bg);border-color:var(--chalk)}
.squads{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.squad{text-align:left;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.squad b{font-family:var(--display);font-size:17px;font-weight:800;font-style:italic;line-height:1.1}
.squad small{color:var(--muted)}
.squad[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.squad[aria-pressed="true"] b::after{content:" ✓";color:var(--gold)}
.summary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:8px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--bg)}

/* par ou impar */
.poi{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding:28px 16px}
.poi h2{font-size:clamp(30px,5vw,44px);text-transform:uppercase}
.nums{display:grid;grid-template-columns:repeat(6,minmax(44px,64px));gap:8px}
.nums button{aspect-ratio:1;border-radius:10px;font-family:var(--display);font-size:30px;font-weight:800;border:2px solid var(--line);background:var(--bg)}
.nums button:hover{border-color:var(--gold)}
.big{font-family:var(--display);font-size:clamp(56px,10vw,96px);font-weight:900;line-height:1}
.tagA{color:var(--a)} .tagB{color:var(--b)}

/* draft */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:linear-gradient(180deg,#121924,#07090c);border:1px solid var(--slate);border-radius:12px;padding:10px 14px}
.sb-team{font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,28px);text-transform:uppercase;line-height:1;display:flex;flex-direction:column;gap:4px}
.sb-team.B{text-align:right}
.sb-team small{font-family:var(--body);font-size:12px;color:var(--muted);text-transform:none;font-weight:600}
.sb-team.A{color:var(--a)} .sb-team.B{color:var(--b)}
.sb-mid{text-align:center}
.sb-mid .count{font-family:var(--display);font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.turn{border-radius:8px;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.turn.A{background:var(--gold-grad);color:var(--a-ink)} .turn.B{background:var(--b);color:var(--b-ink)}
.turn.done{background:var(--white);color:#0B0F14}
.pool-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{font-size:12px;font-weight:700;padding:5px 9px;border-radius:6px;border:1px solid var(--line)}
.filters button[aria-pressed="true"]{background:var(--chalk);color:var(--bg)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding-right:4px}
.pl{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg);min-width:0}
.pl:hover{border-color:var(--muted)}
.pl[aria-pressed="true"]{border-color:var(--gold);background:#2a2208;box-shadow:0 0 12px rgba(212,175,55,.3)}
.pos{font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:4px;padding:2px 4px;background:var(--line);color:var(--chalk);flex:none}
.pl .nm{display:flex;flex-direction:column;min-width:0}
.pl .nm b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.field-wrap{display:flex;flex-direction:column;gap:8px}
.field-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field-title h3{font-size:20px;text-transform:uppercase}
.A .field-title h3{color:var(--a)} .B .field-title h3{color:var(--b)}
.pitch{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass1) 0 12.5%,var(--grass2) 12.5% 25%);border:2px solid var(--chalkline)}
.A .pitch{box-shadow:inset 0 0 0 1px var(--a),0 0 24px rgba(212,175,55,.12)} .B .pitch{box-shadow:inset 0 0 0 1px rgba(229,231,235,.5)}
.pitch::before{content:"";position:absolute;left:25%;right:25%;bottom:0;height:15%;border:2px solid var(--chalkline);border-bottom:0}
.pitch::after{content:"";position:absolute;left:50%;top:0;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid var(--chalkline);border-radius:50%}
.lines{position:absolute;inset:4% 2% 3%;display:flex;flex-direction:column-reverse;justify-content:space-around;z-index:1}
.lr{display:flex;justify-content:space-around;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;width:20%;min-width:0}
.dot{width:clamp(34px,6vw,46px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.04em;border:2px dashed rgba(229,231,235,.35);color:rgba(229,231,235,.65);background:rgba(7,9,12,.55)}
.slot.filled .dot{border-style:solid;font-family:var(--display);font-size:clamp(15px,2.4vw,19px)}
.A .slot.filled .dot{background:var(--a);color:var(--a-ink);border-color:#fff}
.B .slot.filled .dot{background:var(--b);color:var(--b-ink);border-color:#fff}
.slot .sn{font-size:11px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;text-align:center}
.slot.target .dot{border-color:var(--gold);color:var(--gold);animation:pulse 1.1s ease-in-out infinite;cursor:pointer}
.slot.fresh .dot{animation:pop .45s ease-out}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(244,197,52,.25)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.slot.target .dot,.slot.fresh .dot{animation:none}}

/* voto */
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.vbtn.A{background:var(--a);color:var(--a-ink)} .vbtn.B{background:var(--b);color:var(--b-ink)}
.vbtn .n{font-family:var(--display);font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.winner{text-align:center;padding:20px;border-radius:10px;border:2px solid var(--gold)}
.winner .big{color:var(--gold);text-transform:uppercase}
.leftover{display:flex;gap:6px;flex-wrap:wrap}
.leftover span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0}

/* cartas */
.overlay{position:fixed;inset:0;background:rgba(3,8,6,.82);display:grid;place-items:center;z-index:20;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.reveal{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.card{width:min(270px,78vw);aspect-ratio:5/7;border-radius:16px;color:var(--chalk);padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-sizing:border-box;animation:flip .6s ease-out;
  background:linear-gradient(115deg,transparent 0 70%,rgba(212,175,55,.18) 70% 72%,transparent 72%),linear-gradient(160deg,#18202b,#07090c);
  border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15),0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(212,175,55,.25)}
.card .cn{font-family:var(--display);font-size:64px;font-weight:900;font-style:italic;line-height:.8;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h3{font-size:clamp(28px,7vw,34px);text-transform:uppercase;line-height:.95;color:var(--white)}
.card p{margin:0;font-size:14px;line-height:1.35;font-weight:500}
.card.mini{width:auto;aspect-ratio:auto;animation:none;padding:14px;gap:10px;box-shadow:none;border-width:2px}
.card.mini .cn{font-size:34px} .card.mini h3{font-size:24px} .card.mini p{font-size:13px}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card.back{justify-content:center;align-items:center;gap:10px;background:repeating-linear-gradient(60deg,rgba(212,175,55,.06) 0 2px,transparent 2px 14px),linear-gradient(160deg,#18202b,#07090c)}
.card.back img{width:46%;border-radius:14px}
.card.back .q{font-family:var(--display);font-weight:900;font-style:italic;font-size:44px;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.back.minib{width:74px;padding:8px;border-radius:10px;animation:none;gap:4px;box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.card.back.minib .q{font-size:20px} .card.back.minib img{border-radius:6px}
.teaser{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.backs{display:flex;gap:0}.backs .card:first-child{transform:rotate(-8deg)}.backs .card:last-child{transform:rotate(7deg) translateX(-14px)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.hand{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;min-height:32px}
.minicard{display:inline-flex;gap:6px;align-items:center;background:var(--gold);color:#1d1600;border-radius:6px;padding:4px 9px;font-weight:700}
.minicard.used{background:transparent;color:var(--muted);border:1px dashed var(--line);text-decoration:line-through}
.minicard.wait{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600}
.slot.swap .dot{outline:3px solid var(--gold);outline-offset:2px;cursor:pointer}
.slot.chosen .dot{outline:3px solid #fff;outline-offset:2px}
.turn .btn.small{background:rgba(0,0,0,.18);color:inherit}
/* menu, sala, sorteio */
:root{--warn:#f0a35e}
.warn{color:var(--warn)!important}
.menu{display:flex;flex-direction:column;gap:10px;max-width:520px;width:100%;margin:0 auto}
.mbtn{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px;background:linear-gradient(180deg,#151c27,#0b0f14);border:1px solid var(--slate);
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.mbtn:hover{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mbtn:disabled{opacity:.4;cursor:not-allowed}
.mbtn b{display:block;font-weight:800;font-style:italic;text-transform:uppercase;font-size:18px;color:var(--white)}
.mbtn small{color:var(--muted);font-size:13px}
.mbtn.hero{background:var(--gold-grad);border-color:transparent}
.mbtn.hero b,.mbtn.hero small{color:#0B0F14}
.mi{width:34px;height:34px;flex:none;display:grid;place-items:center;color:var(--gold)}
.mbtn.hero .mi{color:#0B0F14}
.mi svg{width:30px;height:30px}
.opt{display:flex;flex-direction:column;gap:4px}
.joinbox{display:flex;flex-direction:column;gap:8px;max-width:420px;width:100%;margin:0 auto;box-sizing:border-box}
.joinbox input,.joinbox select{background:var(--bg);border:1px solid var(--line);color:var(--chalk);border-radius:6px;padding:10px;font:inherit}
.codein{font-size:32px!important;font-weight:900;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.lobby{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bigcode{font-weight:900;font-style:italic;font-size:clamp(56px,14vw,96px);letter-spacing:.12em;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;width:100%;max-width:560px}
.vs>div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;border:1px solid var(--line);min-width:0}
.vs .A{border-color:var(--a)} .vs .B{border-color:rgba(229,231,235,.5)}
.vs b{font-weight:800;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs small{color:var(--muted)} .vs .x{font-weight:900;font-size:28px;color:var(--gold)}
.roomtag{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.12em;border:1px solid var(--gold);color:var(--gold);padding:4px 10px;border-radius:999px}
.codetxt{color:var(--gold);letter-spacing:.1em}
.coin{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--gold-grad);color:#0B0F14;font-weight:900;font-style:italic;font-size:54px;box-shadow:0 0 0 6px rgba(212,175,55,.2),0 0 40px rgba(212,175,55,.35)}
.coin.B{background:linear-gradient(180deg,#fff,#b9bec7)}
.coin.spin{animation:spin 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotateY(1440deg) scale(.6)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.coin.spin{animation:none}}
.news{font-size:13px;color:var(--chalk);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:0 4px}
.turn.waiting{opacity:.75}
.vbtn.mine{box-shadow:0 0 0 3px var(--white)}
.you{font-size:11px;font-style:normal;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);vertical-align:middle}
.fsel{display:inline-flex;gap:8px;align-items:center}
.fsel select{background:var(--bg);color:var(--chalk);border:1px solid var(--slate);border-radius:6px;padding:4px 6px;font:inherit;font-size:13px;font-weight:700}
.slot.mv .dot{cursor:grab}
.slot .sp{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-shadow:0 1px 2px #000;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot .sp.off{color:var(--warn)}
.slot.filled .dot.off{box-shadow:0 0 0 3px var(--warn)}
.legend{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard.focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mh{font-size:22px;text-transform:uppercase;color:var(--white)} .mh span{color:var(--gold)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.mgrid{grid-template-columns:1fr}}
.mt{display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px}
.mt.A{border-color:rgba(212,175,55,.6)}
.mt-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mt-h b{font-weight:800;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-h small{color:var(--muted)}
.mt ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.mt li{display:grid;grid-template-columns:34px 1fr auto;gap:6px;font-size:13px;align-items:baseline}
.ml{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.05em}
.mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md{font-size:10px;color:var(--muted);font-weight:700}
.pl .pos{min-width:26px;text-align:center}

</style>

<div class="wrap" id="app"></div>

const DEFDET={GOL:"GOL",LAT:"LD",ZAG:"ZAG",VOL:"VOL",MEI:"MEI",ATA:"CA"};
const detOf=(n,p)=>(DET[n+"|"+p]||DET[n]||DEFDET[p]).split("/");
const ACC={GOL:["GOL"],LD:["LD"],LE:["LE"],ALA:["LD","LE"],ZAG:["ZAG"],VOL:["VOL"],MEI:["MEI","MC"],MD:["PD","MC","MEI"],ME:["PE","MC","MEI"],PD:["PD"],PE:["PE"],CA:["CA"],ATA:["CA","PD","PE"]};
const pdet=p=>p.det||detOf(p.name,p.pos);

const POSNAME={GOL:"goleiro",LD:"lateral-direito",LE:"lateral-esquerdo",ZAG:"zagueiro",VOL:"volante",MC:"meio-campo",MEI:"meia",PD:"ponta-direita",PE:"ponta-esquerda",CA:"centroavante"};

const ALL=(()=>{const m=new Map();SQUADS.forEach(sq=>sq.p.split(",").forEach(e=>{const[name,pos]=e.replace(/^\*/,"").split(":");const k=name+"|"+pos;
 if(!m.has(k))m.set(k,{name,pos,det:detOf(name,pos),tags:[]});const it=m.get(k);if(!it.tags.includes(sq.t))it.tags.push(sq.t)}));return m})();
const keyOf=p=>p.name+"|"+p.pos;
const other=t=>t==="A"?"B":"A";

const full=t=>S.lineup[t].every(x=>x!==null);

function buildPool(){
 const m=new Map();
 S.selected.forEach(id=>{const sq=SQUADS.find(s=>s.id===id);sq.p.split(",").filter(e=>e[0]!=="*").forEach(e=>{const [name,pos]=e.split(":");const k=name+"|"+pos;
  if(!m.has(k))m.set(k,{name,pos,det:detOf(name,pos),tags:[]});const it=m.get(k);if(!it.tags.includes(sq.t))it.tags.push(sq.t)})});
 return [...m.values()].sort((a,b)=>POS_ORDER.indexOf(a.pos)-POS_ORDER.indexOf(b.pos)||a.name.localeCompare(b.name,"pt")).map((p,i)=>({...p,i,taken:null}));
}
const poolSize=()=>{const k=new Set();S.selected.forEach(id=>SQUADS.find(s=>s.id===id).p.split(",").filter(e=>e[0]!=="*").forEach(e=>k.add(e)));return k.size};
function turn(){
 if(!S.lineup.A.length)return null;
 if(full("A")&&full("B"))return null;
 if(!S.pool.some(p=>!p.taken))return null;
 const n=S.picks,f=S.first;let t;
 if(S.order==="snake"){const k=n%4;t=(k===0||k===3)?f:other(f)}else t=n%2===0?f:other(f);
 if(full(t))t=other(t);
 return t;
}
function addToPool(o,extra){let i=S.pool.findIndex(p=>keyOf(p)===keyOf(o));if(i>=0)return i;i=S.pool.length;S.pool.push({name:o.name,pos:o.pos,det:pdet(o),tags:[...o.tags],i,taken:null,...extra});return i}
function surprisePool(){const inPool=o=>S.pool.some(p=>keyOf(p)===keyOf(o));
 const res=[];S.selected.forEach(id=>SQUADS.find(s=>s.id===id).p.split(",").filter(e=>e[0]==="*").forEach(e=>{const k=e.slice(1).split(":");const o=ALL.get(k[0]+"|"+k[1]);if(o&&!inPool(o)&&!res.includes(o))res.push(o)}));
 if(res.length)return res;
 return [...ALL.values()].filter(o=>!inPool(o)&&SQUADS.some(s=>s.p.split(",").includes("*"+o.name+":"+o.pos)))}
const gkList=()=>[...ALL.values()].filter(o=>o.pos==="GOL"&&!S.pool.some(p=>keyOf(p)===keyOf(o)&&p.taken));
function usable(t){const c=S.cards[t];if(!c||c.used)return false;
 if(c.id==="troca")return count(t)>0&&count(other(t))>0;
 if(c.id==="surpresa")return surprisePool().length>0;
 if(c.id==="goleiro")return gkList().length>0;
 const pos=S.lastPos[other(t)];return !!pos&&S.pool.some(p=>!p.taken&&p.pos===pos)}
const emptySlots=t=>S.lineup[t].map((v,i)=>v===null?i:-1).filter(i=>i>=0);
function bestSlot(t,p){const L=slots(t),e=emptySlots(t);if(typeof p==="string")p={pos:p,det:[DEFDET[p]]};
 const d=pdet(p);for(const x of d){const i=e.find(i=>ACC[L[i]].includes(x)&&ACC[L[i]].length<=2);if(i!==undefined)return i}
 return e.find(i=>fits(p,L[i]))??e.find(i=>L[i]!=="GOL")??e[0]}
function canArrange(t){return S.screen==="draft"&&controls(t)&&!isBot(t)&&!S.reveal&&!S.cmode&&!S.pending&&S.sel===null}
function changeForm(t,f){const players=S.lineup[t].filter(x=>x!==null).sort((a,b)=>(S.pool[a].pos==="GOL"?-1:0)-(S.pool[b].pos==="GOL"?-1:0));
 S.form[t]=f;const L=slots(t);const lu=L.map(()=>null);const rest=[];
 players.forEach(pk=>{const p=S.pool[pk];let i=-1;for(const x of pdet(p)){i=L.findIndex((l,j)=>lu[j]===null&&ACC[l].includes(x)&&ACC[l].length<=2);if(i>=0)break}
  if(i<0)i=L.findIndex((l,j)=>lu[j]===null&&fits(p,l));if(i>=0)lu[i]=pk;else rest.push(pk)});
 rest.forEach(pk=>{let i=lu.findIndex((v,j)=>v===null&&L[j]!=="GOL");if(i<0)i=lu.indexOf(null);lu[i]=pk});
 S.lineup[t]=lu;S.move=null;S.history=[]}

/* ações do jogo */
function checkDraw(t){if(S.cards[t]||count(t)<5)return;const taken=S.cards[other(t)]?.id;
 const opts=Object.keys(CARDS).filter(k=>k!==taken);S.cards[t]={id:opts[Math.floor(Math.random()*opts.length)],used:false,seen:false};
 S.pending=t;S.sel=null;S.move=null;S.news=`${S.names[t]} tirou uma cartinha surpresa`;
 if(isBot(t))botCard(t);else if(controls(t)){S.reveal=t;S.peek=false}}
function loseCard(t){const c=S.cards[t];c.used=true;c.lost=true;S.pending=null;S.cmode=null;S.news=`${S.names[t]} tirou ${CARDS[c.id].t}, mas não tinha jogada possível`}
function place(t,pk,i,via){if(via)S.pending=null;S.lineup[t][i]=pk;S.pool[pk].taken=t;S.lastPos[t]=S.pool[pk].pos;S.lastFill={t,i};
 if(via){S.history=[];S.news=`${S.names[t]} usou ${CARDS[via].t}: ${S.pool[pk].name} entrou no time`}
 else{S.history.push({t,i,pk});S.picks++;S.news=`${S.names[t]} escolheu ${S.pool[pk].name}`}
 checkDraw(t)}
function doSwap(t,mine,theirs){const o=other(t),a=S.lineup[t][mine],b=S.lineup[o][theirs];
 S.lineup[t][mine]=b;S.lineup[o][theirs]=a;S.pool[a].taken=o;S.pool[b].taken=t;S.cards[t].used=true;S.pending=null;S.history=[];S.lastFill={t,i:mine};
 S.news=`${S.names[t]} usou Troca: levou ${S.pool[b].name} e deu ${S.pool[a].name}`}
function doGoleiro(t,key){const idx=addToPool(ALL.get(key));const old=S.lineup[t][0];if(old!==null)S.pool[old].taken=null;
 S.lineup[t][0]=idx;S.pool[idx].taken=t;S.cards[t].used=true;S.pending=null;S.history=[];S.lastFill={t,i:0};
 S.news=`${S.names[t]} usou Goleiro: ${S.pool[idx].name} assumiu o gol`;checkDraw(t)}
function useCard(t){const c=S.cards[t];S.sel=null;S.move=null;if(!usable(t)){loseCard(t);commit();return}
 if(c.id==="troca")S.cmode={type:"troca",t,step:0,mine:null};
 else if(c.id==="goleiro")S.cmode={type:"goleiro",t,list:gkList().map(keyOf)};
 else if(c.id==="surpresa"){const l=surprisePool();const o=l[Math.floor(Math.random()*l.length)];
  S.sel=addToPool(o,{surprise:true});S.cmode={type:"bonus",t,card:"surpresa"};c.used=true;commit()}
 else{S.cmode={type:"bonus",t,card:"mesma",pos:S.lastPos[other(t)]};c.used=true;commit()}}
function startDraft(){S.pool=buildPool();S.lineup={A:slots("A").map(()=>null),B:slots("B").map(()=>null)};S.picks=0;S.history=[];S.sel=null;S.filter="ALL";
 S.vmap={};S.votes={A:0,B:0};S.closed=false;S.cards={A:null,B:null};S.reveal=null;S.cmode=null;S.lastPos={A:null,B:null};S.news=`${S.names[S.first]} começa escolhendo`;S.screen="draft"}

/* robô */
const bscore=p=>(STARS.has(p.name)?3:1)+Math.random()*1.4;
function botCard(t){const c=S.cards[t];if(!c||c.used)return;const o=other(t);
 if(!usable(t))return loseCard(t);
 if(c.id==="goleiro"&&S.lineup[t][0]!==null){const l=gkList();const sc=new Map(l.map(g=>[g,bscore(g)]));return doGoleiro(t,keyOf(l.reduce((a,b)=>sc.get(b)>sc.get(a)?b:a)))}
 if(c.id==="mesma"){const pos=S.lastPos[o];const L=slots(t);if(!emptySlots(t).some(i=>ACC[L[i]].some(x=>DEFDET[pos]===x))){const cand=S.pool.filter(p=>!p.taken&&p.pos===pos);const sc=new Map(cand.map(p=>[p,bscore(p)]));const p=cand.reduce((a,b)=>sc.get(b)>sc.get(a)?b:a);c.used=true;return place(t,p.i,bestSlot(t,pos),"mesma")}}
 if(c.id==="troca"){const sc=pk=>(STARS.has(S.pool[pk].name)?3:1)+(pk%7)/10;
  const theirs=S.lineup[o].map((pk,i)=>({pk,i})).filter(x=>x.pk!==null&&slots(o)[x.i]!=="GOL");const mine=S.lineup[t].map((pk,i)=>({pk,i})).filter(x=>x.pk!==null&&slots(t)[x.i]!=="GOL");
  if(theirs.length&&mine.length){const best=theirs.reduce((a,b)=>sc(b.pk)>sc(a.pk)?b:a),worst=mine.reduce((a,b)=>sc(b.pk)<sc(a.pk)?b:a);return doSwap(t,worst.i,best.i)}
  return loseCard(t)}
 if(c.id==="surpresa"){const l=surprisePool();if(!l.length)return;const p=l[Math.floor(Math.random()*l.length)];
  const idx=addToPool(p,{surprise:true});c.used=true;place(t,idx,bestSlot(t,p),"surpresa")}
 else if(c.id==="goleiro"){if(S.lineup[t][0]!==null)return;const l=gkList();if(!l.length)return;
  const sc=new Map(l.map(g=>[g,bscore(g)]));const g=l.reduce((a,b)=>sc.get(b)>sc.get(a)?b:a);doGoleiro(t,keyOf(g))}
 else if(c.id==="mesma"){const pos=S.lastPos[o];if(!pos)return;const L=slots(t);
  if(!emptySlots(t).some(i=>S.pool.some(p=>!p.taken&&p.pos===pos&&fits(p,L[i]))))return;const cand=S.pool.filter(p=>!p.taken&&p.pos===pos);if(!cand.length)return;
  const sc=new Map(cand.map(p=>[p,bscore(p)]));const p=cand.reduce((a,b)=>sc.get(b)>sc.get(a)?b:a);c.used=true;place(t,p.i,bestSlot(t,pos),"mesma")}
 else if(c.id==="troca"){const theirs=S.lineup[o].map((pk,i)=>({pk,i})).filter(x=>x.pk!==null&&STARS.has(S.pool[x.pk].name)&&slots(o)[x.i]!=="GOL");
  const mine=S.lineup[t].map((pk,i)=>({pk,i})).filter(x=>x.pk!==null&&!STARS.has(S.pool[x.pk].name)&&slots(t)[x.i]!=="GOL");
  if(!theirs.length||!mine.length)return;doSwap(t,mine[mine.length-1].i,theirs[Math.floor(Math.random()*theirs.length)].i)}}
function botMove(){const t=BOT;
 if(turn()!==t)return;
 const L=slots(t),E=emptySlots(t),needGK=E.some(i=>L[i]==="GOL");
 const av=S.pool.filter(p=>!p.taken);let cand=av.filter(p=>E.some(i=>fits(p,L[i])));if(!cand.length)cand=av;
 const sc=new Map(cand.map(p=>[p,bscore(p)+(p.pos==="GOL"&&needGK?2.5:0)]));const p=cand.reduce((a,b)=>sc.get(b)>sc.get(a)?b:a);
 place(t,p.i,bestSlot(t,p),null)}
function scheduleBot(){if(S.play!=="bot"||botTimer)return;
 if(!(S.screen==="draft"&&turn()===BOT&&!S.reveal&&!S.cmode&&!S.pending))return;
 botTimer=setTimeout(()=>{botTimer=null;if(S.screen==="draft"&&turn()===BOT&&!S.reveal&&!S.cmode&&!S.pending){botMove();render()}},1100)}

/* online fora do Claude: servidor público de mensagens, o anfitrião guarda a sala */
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
const TOPIC=c=>"racha-dos-campeoes/v1/"+c;
let MQ=null,STANDALONE=false;const ROOMS={};
const isObj=x=>x&&typeof x==="object"&&!Array.isArray(x);
function deepMerge(a,b){const o={...(a||{})};for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?deepMerge(o[k],b[k]):b[k]}return o}
const jclone=x=>x==null?x:JSON.parse(JSON.stringify(x));
function myId(){try{let v=localStorage.getItem("racha_me");if(!v){v="p_"+Math.random().toString(36).slice(2,12);localStorage.setItem("racha_me",v)}return v}catch(e){return "p_"+Math.random().toString(36).slice(2,12)}}
function connectBroker(ver){return new Promise((res,rej)=>{if(!window.mqtt)return rej({code:"no-lib"});let i=0;
 const next=()=>{if(i>=BROKERS.length)return rej({code:"unavailable"});const url=BROKERS[i++];
  const c=mqtt.connect(url,{protocolVersion:ver||4,clientId:"rc_"+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:2000,keepalive:30});
  let done=false;const t=setTimeout(()=>{if(done)return;done=true;try{c.end(true)}catch(e){}next()},9000);
  c.once("connect",()=>{if(done)return;done=true;clearTimeout(t);res(c)});
  c.once("error",()=>{if(done)return;done=true;clearTimeout(t);try{c.end(true)}catch(e){}next()})};next()})}
async function broker(){if(MQ&&!MQ.disconnecting)return MQ;MQ=await connectBroker();
 MQ.on("offline",()=>{S.net="Sem conexão no momento. Tentando reconectar…";render()});
 MQ.on("connect",()=>{if(S.net&&S.net.startsWith("Sem conexão")){S.net=null;render()}});return MQ}
function readRetained(c,code,ms){return new Promise(res=>{const topic=TOPIC(code)+"/state";let got=null;
 const h=(t,buf)=>{if(t!==topic)return;try{const m=JSON.parse(buf.toString());if(m&&m.d){got=m.d;fin()}}catch(e){}};
 const fin=()=>{clearTimeout(tm);c.removeListener("message",h);res(got)};
 c.on("message",h);c.subscribe(topic,{qos:1});const tm=setTimeout(fin,ms)})}
const snapOf=d=>({exists:!!d,data:()=>jclone(d),metadata:{fromCache:false,hasPendingWrites:false}});
async function roomOf(code,creating){
 if(ROOMS[code])return ROOMS[code];const c=await broker();const T=TOPIC(code);
 const r={code,data:null,ls:[],host:false};
 const emit=()=>{const d=r.data;r.ls.forEach(f=>f(snapOf(d)))};
 if(!creating)r.data=await readRetained(c,code,4000);
 r.host=creating||(r.data&&r.data.hostUid===ME);
 if(r.host){
  const pub=()=>{if(r.data)c.publish(T+"/state",JSON.stringify({d:r.data,at:Date.now()}),{qos:1,retain:true})};
  c.on("message",(t,buf)=>{if(t!==T+"/patch"||!r.data)return;try{const m=JSON.parse(buf.toString());if(isObj(m.d)){r.data=deepMerge(r.data,m.d);emit();pub()}}catch(e){}});
  c.subscribe(T+"/patch",{qos:1});c.on("connect",()=>{c.subscribe(T+"/patch",{qos:1});pub()});
  r.write=(body,full)=>{r.data=full?jclone(body):deepMerge(r.data,jclone(body));emit();pub()};
 } else {
  c.on("message",(t,buf)=>{if(t!==T+"/state")return;try{const m=JSON.parse(buf.toString());if(m&&m.d){r.data=m.d;emit()}}catch(e){}});
  c.subscribe(T+"/state",{qos:1});c.on("connect",()=>c.subscribe(T+"/state",{qos:1}));
  r.write=body=>{c.publish(T+"/patch",JSON.stringify({d:body}),{qos:1})};
 }
 ROOMS[code]=r;return r}
const mqttDB={doc(path){const code=path.split("/")[1];return{
 async get(){if(ROOMS[code]&&ROOMS[code].data)return snapOf(ROOMS[code].data);const c=await broker();return snapOf(await readRetained(c,code,3000))},
 async set(body){const r=await roomOf(code,true);r.write(body,true)},
 async update(body){const r=await roomOf(code,false);r.write(body,false)},
 onSnapshot(next,err){let live=true;roomOf(code,false).then(r=>{if(!live)return;r.ls.push(next);if(r.data)next(snapOf(r.data))}).catch(e=>err&&err(e));
  return()=>{live=false;const r=ROOMS[code];if(r)r.ls=r.ls.filter(f=>f!==next)}}}}};

function lsGet(){try{return JSON.parse(localStorage.getItem("racha_sala")||"null")}catch(e){return null}}
function lsSet(v){try{v?localStorage.setItem("racha_sala",JSON.stringify(v)):localStorage.removeItem("racha_sala")}catch(e){}}
function commit(mode){if(S.play!=="online"||!S.room||!DB)return;
 const data={};SHARED.forEach(k=>data[k]=S[k]);
 if(mode!=="set"&&mode!=="both"&&(S.seat==="A"||S.seat==="B")){data.lineup={[S.seat]:S.lineup[S.seat]};data.form={[S.seat]:S.form[S.seat]}}
 const body=JSON.parse(JSON.stringify(data));const ref=DB.doc("rooms/"+S.room);
 writeQ=writeQ.then(()=>mode==="set"?ref.set(body):ref.update(body)).catch(e=>{S.net=e&&e.code==="invalid_argument"?"Seu acesso a este jogo não permite jogar online. Peça ao dono para compartilhar com você como Contribuidor.":"Não deu para salvar a jogada. Verifique a conexão.";render()})}
function commitArrange(t){if(S.play!=="online"||!S.room||!DB||S.seat!==t)return;const ref=DB.doc("rooms/"+S.room);
 const body=JSON.parse(JSON.stringify({lineup:{[t]:S.lineup[t]},form:{[t]:S.form[t]}}));
 writeQ=writeQ.then(()=>ref.update(body)).catch(()=>{S.net="Não deu para salvar a mudança. Verifique a conexão.";render()})}
function subscribe(code){if(unsub)unsub();let got=false;
 const timer=setTimeout(()=>{if(!got){S.net="A sala ainda não respondeu. Verifique a conexão.";render()}},10000);
 unsub=DB.doc("rooms/"+code).onSnapshot(snap=>{got=true;clearTimeout(timer);
  if(!snap.exists){S.net="Essa sala não existe.";render();return}
  S.net=null;if(S.hostEditing)return;
  const d=JSON.parse(JSON.stringify(snap.data()));SHARED.forEach(k=>{if(k in d)S[k]=d[k]});
  if(S.screen!=="draft"){S.cmode=null;S.sel=null}
  else if(!S.cmode&&S.sel!==null&&(!S.pool[S.sel]||S.pool[S.sel].taken))S.sel=null;
  if(S.reveal&&!controls(S.reveal))S.reveal=null;
  render()},e=>{clearTimeout(timer);S.net="A conexão com a sala caiu. Saia e entre de novo.";render()})}

 catch(e){S.net="Não deu para criar a sala. Verifique a conexão.";render()}}

/* mural de votação: cada publicação fica 24 horas no ar */
const MURAL="racha-dos-campeoes/v1/mural",DAY=864e5;
const MUR={list:{},votes:{},status:"idle",focus:null,copied:null};let MC=null;
async function muralConn(){if(MC&&MC.connected)return MC;try{MC=await connectBroker(5)}catch(e){MC=await connectBroker(4)}return MC}
function muralPub(c,topic,obj){const o={qos:1,retain:true};if(c.options&&c.options.protocolVersion===5)o.properties={messageExpiryInterval:86400};c.publish(topic,JSON.stringify(obj),o)}
async function openMural(focus){
 S.screen="mural";MUR.focus=focus||MUR.focus;render();
 if(MUR.status==="ready"||MUR.status==="loading")return;
 MUR.status="loading";render();
 try{
  if(STANDALONE){const c=await muralConn();
   c.on("message",(t,buf)=>{if(!t.startsWith(MURAL+"/"))return;const parts=t.slice(MURAL.length+1).split("/");let m=null;try{m=JSON.parse(buf.toString())}catch(e){return}
    if(parts[1]==="meta"&&m&&m.id&&Date.now()-m.at<DAY)MUR.list[m.id]=m;
    if(parts[1]==="v"&&parts[2]&&m&&m.t)(MUR.votes[parts[0]]||(MUR.votes[parts[0]]={}))[parts[2]]=m.t;
    if(S.screen==="mural"){clearTimeout(openMural.t);openMural.t=setTimeout(render,120)}});
   c.subscribe([MURAL+"/+/meta",MURAL+"/+/v/+"],{qos:1});
   setTimeout(()=>{MUR.status="ready";if(S.screen==="mural")render()},1500);
  } else if(DB){
   let got=false;const tm=setTimeout(()=>{if(!got){MUR.status="error";render()}},10000);
   DB.collection("mural").onSnapshot(qs=>{got=true;clearTimeout(tm);MUR.list={};MUR.votes={};
    qs.docs.forEach(d=>{const x=d.data();if(x&&x.id&&Date.now()-x.at<DAY){MUR.list[x.id]=x;MUR.votes[x.id]={...(x.votes||{})}}});
    MUR.status="ready";if(S.screen==="mural")render()},()=>{clearTimeout(tm);MUR.status="error";render()});
  } else {MUR.status="off";render()}
 }catch(e){MUR.status="error";render()}}
function teamList(t){const L=slots(t);return L.map((lbl,i)=>{const pk=S.lineup[t][i];const p=pk==null?null:S.pool[pk];return p?[lbl,p.name,pdet(p).join("/")]:[lbl,"—",""]})}
async function publishMural(){
 if(S.publishedId)return openMural(S.publishedId);
 const id=Math.random().toString(36).slice(2,10);
 const e={id,at:Date.now(),names:{...S.names},form:{...S.form},teams:{A:teamList("A"),B:teamList("B")},champs:S.selected.map(x=>SQUADS.find(s=>s.id===x).n)};
 try{
  if(STANDALONE){const c=await muralConn();muralPub(c,MURAL+"/"+id+"/meta",e)}
  else if(DB){await DB.collection("mural").doc(id).set({...e,votes:{}})}
  else throw 0;
  S.publishedId=id;MUR.list[id]=e;MUR.votes[id]={};openMural(id);
 }catch(err){S.net="Não consegui publicar no mural agora. Verifique a conexão.";render()}}
async function muralVote(id,t){if(!ME)return;(MUR.votes[id]||(MUR.votes[id]={}))[ME]=t;render();
 try{if(STANDALONE){const c=await muralConn();muralPub(c,MURAL+"/"+id+"/v/"+ME,{t,at:Date.now()})}
  else if(DB)await DB.collection("mural").doc(id).update({votes:{[ME]:t}})}catch(e){S.net="Não consegui registrar o voto.";render()}}
const muralLink=id=>location.href.split("#")[0]+"#mural-"+id;
function leftTxt(at){const ms=at+DAY-Date.now();const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return ms<=0?"encerrada":h>0?`fica mais ${h}h${m?` ${m}min`:""} no ar`:`fica mais ${m}min no ar`}
function mural(){
 const ents=Object.values(MUR.list).filter(e=>Date.now()-e.at<DAY).sort((a,b)=>(b.id===MUR.focus)-(a.id===MUR.focus)||b.at-a.at);
 const st=MUR.status;
 const card=e=>{const v=MUR.votes[e.id]||{};const c={A:0,B:0};Object.values(v).forEach(x=>{if(c[x]!==undefined)c[x]++});const mine=ME?v[ME]:null;const tot=c.A+c.B;
  const col=t=>`<div class="mt ${t}"><div class="mt-h"><b>${esc(e.names[t])}</b><small>${esc(e.form[t])}</small></div>
   <ol>${e.teams[t].map(([l,n,d])=>`<li><span class="ml">${esc(l)}</span><span class="mn">${esc(n)}</span><span class="md">${esc(d)}</span></li>`).join("")}</ol>
   <button class="vbtn ${t} ${mine===t?"mine":""}" data-mvote="${t}" data-id="${e.id}" ${ME?"":"disabled"}><span class="n">${c[t]}</span>${mine===t?"Seu voto":"Votar"}${tot?` · ${Math.round(c[t]*100/tot)}%`:""}</button></div>`;
  return `<article class="panel mcard ${e.id===MUR.focus?"focus":""}">
   <div class="row" style="justify-content:space-between"><h3 class="mh">${esc(e.names.A)} <span>×</span> ${esc(e.names.B)}</h3><span class="label">${leftTxt(e.at)}</span></div>
   <p class="note">${esc((e.champs||[]).join(" + "))}</p>
   <div class="mgrid">${col("A")}${col("B")}</div>
   <div class="row"><button class="btn ghost small" data-act="mcopy" data-id="${e.id}">${MUR.copied===e.id?"Link copiado!":"Copiar link desta votação"}</button></div>
  </article>`};
 return `<div class="row"><button class="btn ghost small" data-act="home">← Menu</button><span class="label">Mural de votação</span></div>
 <section class="panel"><h2 style="font-size:28px;text-transform:uppercase">Qual time ganharia?</h2>
  <p class="note">Cada racha publicado fica 24 horas no ar. Qualquer pessoa com o link vota uma vez em cada um e pode mudar o voto.</p></section>
 ${S.net?`<p class="note warn">${esc(S.net)}</p>`:""}
 ${st==="loading"?`<p class="note">Carregando o mural…</p>`:st==="error"?`<p class="note warn">Não consegui abrir o mural agora. Verifique a internet e tente de novo.</p>`:st==="off"?`<p class="note warn">O mural precisa de internet e, no Claude, da sua conta.</p>`:""}
 ${ents.length?ents.map(card).join(""):st==="ready"?`<p class="note">Nenhum racha publicado nas últimas 24 horas. No fim de uma partida, toque em <b>Publicar no mural</b>.</p>`:""}`;
}

   <h2><span class="tag${win}">${esc(S.names[win])}</span> começa escolhendo</h2>
   ${isHost()?`<button class="btn" data-act="startDraft" data-first="${win}">Começar o racha →</button>`:`<p class="note">Aguardando ${esc(A)} começar.</p>`}`}
 }
 return `<section class="panel poi">${body}</section>${S.net?`<p class="note warn">${esc(S.net)}</p>`:""}
 <div>${S.play==="online"?`<button class="btn ghost small" data-act="leave">Sair da sala</button>`:`<button class="btn ghost small" data-act="back">← Voltar</button>`}</div>`;
}

function hand(t){const c=S.cards[t];
 if(!c)return `<span class="minicard wait">Carta no 5º jogador</span>`;
 const C=CARDS[c.id];if(c.used)return `<span class="minicard used">${C.n}. ${C.t}</span><span class="note">${c.lost?"sem jogada":"usada"}</span>`;
 if(!controls(t)||isBot(t))return `<span class="minicard">Carta surpresa</span><span class="note">sendo usada…</span>`;
 return `<span class="minicard">Carta surpresa</span>`+(!S.cmode&&!S.reveal?`<button class="btn small" data-use="${t}">Usar carta agora</button>`:"")}

function field(t,interactive){
 const rows=FORMS[S.form[t]];let idx=0;const cur=turn();const M=S.cmode;
 const bonus=M&&M.type==="bonus";
 const canTarget=interactive&&!S.reveal&&S.sel!==null&&controls(t)&&(bonus?M.t===t:(!M&&!S.pending&&cur===t));
 const swapOn=interactive&&M&&M.type==="troca"&&((M.step===0&&t===M.t)||(M.step===1&&t!==M.t));
 const arr=interactive&&canArrange(t);
 return `<div class="field-wrap ${t}">
  <div class="field-title"><h3>${esc(S.names[t])}${S.play==="online"&&S.seat===t?` <small class="you">você</small>`:""}</h3>${interactive&&canArrange(t)?`<span class="fsel"><select data-fchange="${t}" aria-label="Formação de ${esc(S.names[t])}">${Object.keys(FORMS).map(f=>`<option ${S.form[t]===f?"selected":""}>${f}</option>`).join("")}</select><span class="label">${count(t)}/11</span></span>`:`<span class="label">${S.form[t]} · ${count(t)}/11</span>`}</div>
  ${interactive?`<div class="hand">${hand(t)}</div>`:""}
  <div class="pitch"><div class="lines">${rows.map(r=>`<div class="lr">${r.map(lbl=>{const i=idx++;const pk=S.lineup[t][i];
   if(pk!==null&&pk!==undefined){const p=S.pool[pk];const fr=S.lastFill&&S.lastFill.t===t&&S.lastFill.i===i;
    const ch=M&&M.type==="troca"&&M.step===1&&t===M.t&&M.mine===i;
    const off=!fits(p,lbl);const inner=`<span class="dot ${off?"off":""}">${esc(initials(p.name))}</span><span class="sn">${esc(p.name)}</span><span class="sp ${off?"off":""}" title="${off?"Jogando improvisado":""}">${pdet(p).join("/")}</span>`;
    if(swapOn)return `<button class="slot filled swap" data-swap="${i}" data-team="${t}" title="${esc(p.name)}">${inner}</button>`;
    if(arr)return `<button class="slot filled mv ${S.move&&S.move.t===t&&S.move.i===i?"chosen":""} ${fr?"fresh":""}" data-mv="${i}" data-team="${t}" title="Mover ${esc(p.name)}">${inner}</button>`;
    return `<div class="slot filled ${fr?"fresh":""} ${ch?"chosen":""}" title="${esc(p.name)}">${inner}</div>`}
   if(arr&&S.move&&S.move.t===t)return `<button class="slot target" data-mv="${i}" data-team="${t}" aria-label="Mover para ${lbl}"><span class="dot">${lbl}</span></button>`;
   return canTarget?`<button class="slot target" data-slot="${i}" data-team="${t}" aria-label="Colocar em ${lbl}"><span class="dot">${lbl}</span></button>`
     :`<div class="slot"><div class="dot">${lbl}</div></div>`}).join("")}</div>`).join("")}</div></div>
 </div>`;
}

function scoreboard(){
 return `<div class="scoreboard"><div class="sb-team A">${esc(S.names.A)}<small>${S.form.A}</small></div>
  <div class="sb-mid"><div class="count">${count("A")} × ${count("B")}</div><span class="label">escolhidos</span></div>
  <div class="sb-team B">${esc(S.names.B)}<small>${S.form.B}</small></div></div>
  ${S.news?`<div class="news"><span class="label">Última jogada</span> ${esc(S.news)}</div>`:""}`;
}

function banner(t){
 const M=S.cmode,sel=S.sel!==null?S.pool[S.sel]:null,cancel="";
 if(M){const N=esc(S.names[M.t]);let msg="";
  if(M.type==="troca")msg=M.step===0?`<span>Troca · ${N}: toque num jogador seu</span>${cancel}`:`<span>Troca · agora toque no jogador de ${esc(S.names[other(M.t)])} que vem para o seu time</span>${cancel}`;
  else if(M.type==="goleiro")msg=`<span>Goleiro · ${N}: escolha qualquer goleiro campeão</span>${cancel}`;
  else if(M.card==="surpresa")msg=`<span>Jogador surpresa de ${N}: ${esc(sel.name)} (${sel.pos})</span><span>Toque numa posição do campo</span>`;
  else msg=sel?`<span>Mesma posição · ${esc(sel.name)}</span><span>Toque numa posição do campo</span>`:`<span>Mesma posição · ${N}: escolha um ${M.pos} da lista</span>`;
  return `<div class="turn ${M.t}">${msg}</div>`}
 if(S.pending){const p=S.pending,N=esc(S.names[p]);return controls(p)&&!isBot(p)
  ?`<div class="turn ${p}"><span>${N} tirou uma cartinha surpresa</span><span>Use agora: a carta não pode ser guardada</span></div>`
  :`<div class="turn ${p} waiting"><span>${N} tirou uma cartinha surpresa</span><span>Aguardando a carta ser usada…</span></div>`}
 if(S.move){const p=S.pool[S.lineup[S.move.t][S.move.i]];return `<div class="turn ${S.move.t}"><span>Mover ${esc(p.name)}: toque em outra posição do seu campo</span><button class="btn small" data-act="cancelMove">Cancelar</button></div>`}
 if(S.msg){const m=S.msg;S.msg=null;return `<div class="turn ${t}"><span>${esc(m)}</span><span>Escolha um jogador normalmente</span></div>`}
 if(t===null)return `<div class="turn done"><span>Times fechados!</span><button class="btn small ghost" data-act="toVote">Ver os times →</button></div>`;
 if(!controls(t))return `<div class="turn ${t} waiting"><span>Vez de ${esc(S.names[t])}</span><span>${isBot(t)?"O robô está pensando…":"Aguardando a escolha…"}</span></div>`;
 const who=S.play==="local"?`Vez de ${esc(S.names[t])}`:"Sua vez";
 return `<div class="turn ${t}"><span>${who} · escolha ${S.picks+1}</span><span>${sel?`${esc(sel.name)} → toque numa posição do campo`:"Toque num jogador da lista"}</span></div>`;
}

function draft(){
 const t=turn(),M=S.cmode;
 const lockPos=M&&M.type==="bonus"&&M.card==="mesma"?M.pos:null;
 const filter=lockPos||S.filter;
 const list=S.pool.filter(p=>!p.taken&&(filter==="ALL"||p.pos===filter));
 const left=S.pool.filter(p=>!p.taken).length;
 const pickOff=!!S.reveal||(M?(M.type!=="bonus"||M.card==="surpresa"):(!!S.pending||t===null||!controls(t)));
 const plBtn=(p,attr)=>`<button class="pl" ${attr} ${pickOff&&!attr.startsWith("data-gk")?"disabled":""} title="${pdet(p).map(x=>POSNAME[x]).join(", ")}"><span class="pos">${pdet(p).join("/")}</span><span class="nm"><b>${esc(p.name)}</b><small>${p.tags.join(" · ")}</small></span></button>`;
 const poolSec=M&&M.type==="goleiro"
  ?`<section class="panel"><div class="pool-head"><span class="label">Todos os goleiros campeões · ${M.list.length}</span></div>
    <div class="pool">${M.list.map((k,j)=>plBtn(ALL.get(k),`data-gk="${j}"`)).join("")}</div></section>`
  :`<section class="panel">
  <div class="pool-head"><span class="label">Disponíveis · ${left}</span>
   <div class="filters" role="group" aria-label="Filtrar por posição">${["ALL",...POS_ORDER].map(f=>`<button data-filter="${f}" aria-pressed="${filter===f}" ${lockPos?"disabled":""}>${f==="ALL"?"Todos":f}</button>`).join("")}</div></div>
  <div class="pool">${list.map(p=>plBtn(p,`data-pick="${p.i}" aria-pressed="${S.sel===p.i}"`)).join("")||`<p class="note">Ninguém nessa posição.</p>`}</div>
  <p class="legend">GOL goleiro · LD/LE laterais · ZAG zagueiro · VOL volante · MC meio-campo · MEI meia · PD/PE pontas · CA centroavante</p>
 </section>`;
 let ov="";
 if(S.reveal){const r=S.reveal,N=esc(S.names[r]),can=turn()===r&&usable(r);
  ov=S.peek
  ?`<div class="overlay" role="dialog" aria-label="Carta de ${N}"><div class="reveal">
   <span class="label" style="color:var(--chalk)">Carta secreta de ${N}</span>
   ${cardFace(S.cards[r].id)}
   <div class="row" style="justify-content:center"><button class="btn" data-act="useNow">${usable(r)?"Usar agora":"Continuar"}</button></div>
   <p class="note">${usable(r)?"A cartinha é usada na hora, mesmo fora da sua vez.":"Agora não tem jogada possível com essa carta, então ela se perde."}</p>
  </div></div>`
  :`<div class="overlay" role="dialog" aria-label="Carta surpresa"><div class="reveal">
   <span class="label" style="color:var(--chalk)">${N} escolheu o 5º jogador e tirou uma cartinha surpresa</span>
   ${cardBack(false)}
   <h2 style="font-size:24px;text-transform:uppercase">${S.play==="local"?`Só ${N} pode olhar`:"Só você vê essa carta"}</h2>
   <div class="row" style="justify-content:center"><button class="btn" data-act="flip">Virar carta</button></div>
  </div></div>`}
 const foot=S.play==="online"
  ?`<button class="btn ghost small" data-act="leave">Sair da sala</button>`
  :`${S.play==="local"?`<button class="btn ghost small" data-act="undo" ${S.history.length&&!M?"":"disabled"}>↶ Desfazer última escolha</button>`:""}<button class="btn ghost small" data-act="restart">Recomeçar</button>`;
 return `${scoreboard()}${banner(t)}${S.net?`<p class="note warn">${esc(S.net)}</p>`:""}${poolSec}
 <div class="grid2">${field("A",true)}${field("B",true)}</div>
 <div class="row">${foot}</div>${ov}`;
}

function vote(){
 const left=S.pool.filter(p=>!p.taken);
 const on=S.play==="online";
 const V=on?{A:Object.values(S.vmap||{}).filter(v=>v==="A").length,B:Object.values(S.vmap||{}).filter(v=>v==="B").length}:S.votes;
 const mine=on&&ME?S.vmap?.[ME]:null;
 let res="";
 if(S.closed){res=V.A===V.B?`<div class="winner"><span class="label">${V.A} × ${V.B}</span><div class="big">Empate</div><p class="note">Ninguém levou. Bora outro racha?</p></div>`
   :(()=>{const w=V.A>V.B?"A":"B";return `<div class="winner"><span class="label">${V.A} × ${V.B} nos votos</span><div class="big">${esc(S.names[w])}</div><p class="note">montou o melhor time.</p></div>`})()}
 const canClose=!on||S.seat==="A";
 return `${scoreboard()}
 <section class="panel" style="display:flex;flex-direction:column;gap:12px">
  <h2 style="font-size:30px;text-transform:uppercase">Qual time ganharia?</h2>
  <p class="note">${on?"Cada pessoa com o jogo aberto vota uma vez. Dá para mudar o voto até encerrar.":"Cada amigo toca uma vez no time que acha melhor."}</p>
  ${S.closed?res:`<div class="vote">${["A","B"].map(t=>`<button class="vbtn ${t} ${mine===t?"mine":""}" data-vote="${t}" ${on&&!ME?"disabled":""}><span class="n">${V[t]}</span>${mine===t?"Seu voto: ":"+1 para "}${esc(S.names[t])}</button>`).join("")}</div>
  <div class="row">${canClose?`<button class="btn" data-act="close" ${V.A+V.B?"":"disabled"}>Encerrar votação</button>`:`<span class="note">${esc(S.names.A)} encerra a votação.</span>`}${on?"":`<button class="btn ghost small" data-act="zero">Zerar votos</button>`}</div>`}
 </section>
 <div class="grid2">${field("A",false)}${field("B",false)}</div>
 ${left.length?`<section class="panel"><span class="label">Sobraram (${left.length})</span><div class="leftover" style="margin-top:8px">${left.map(p=>`<span>${esc(p.name)}</span>`).join("")}</div></section>`:""}
 <div class="row">${on?(S.seat==="A"?`<button class="btn" data-act="again">Novo racha</button>`:"")+`<button class="btn ghost small" data-act="leave">Sair da sala</button>`
   :`<button class="btn ghost" data-act="backDraft">← Voltar à escolha</button><button class="btn" data-act="again">Novo racha</button>`}</div>
 ${!on||S.seat==="A"?`<section class="panel row" style="justify-content:space-between"><span><b>Mural de votação</b><br><span class="note">Publica os dois times por 24 horas para todo mundo votar.</span></span><button class="btn" data-act="publish">${S.publishedId?"Ver no mural":"Publicar no mural (24h)"}</button></section>`:""}`;
}

function render(){
 const app=document.getElementById("app");
 const head=S.screen==="home"
  ?`<header class="brand"><h1 style="margin:0"><img src="${LOGO_MAIN}" alt="Racha dos Campeões" width="585" height="385"></h1><p>Tire o time com os titulares das finais que valeram taça.</p></header>`
  :`<header class="brand compact"><img src="${LOGO_ICON}" alt="" width="140" height="133"><b><span>Racha dos</span> Campeões</b>${S.room?`<span class="roomtag">Sala ${esc(S.room)}</span>`:""}</header>`;
 const screens={home,setup,join,lobby,start:startScreen,draft,vote,mural};
 app.innerHTML=head+(screens[S.screen]||home)();
 S.lastFill=null;
 scheduleBot();
}

/* eventos */
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
 const act=d.act;
 if(d.play){S.play=d.play;S.room=null;S.seat=S.play==="online"?"A":null;S.hostEditing=false;S.net=null;
  if(S.play==="bot")S.names.B="Robô";else if(S.names.B==="Robô"||S.names.B==="Aguardando…")S.names.B="Time Prata";
  S.screen="setup"}
 else if(d.comp){S.comp=d.comp}
 else if(d.squad){const i=S.selected.indexOf(d.squad);i>=0?S.selected.splice(i,1):S.selected.push(d.squad)}
 else if(d.order){S.order=d.order}
 else if(d.start){S.start=d.start}
 else if(d.choice){if(!controls("A"))return;S.poi.choice=d.choice;S.poi.step=1;commit()}
 else if(d.num!==undefined){const who=d.who;if(!controls(who))return;
  if(who==="A"){S.poi.numA=+d.num;if(S.play==="bot"){S.poi.numB=Math.floor(Math.random()*6);S.poi.step=3}else S.poi.step=2}
  else{S.poi.numB=+d.num;S.poi.step=3}
  commit()}
 else if(d.filter){S.filter=d.filter}
 else if(d.pick!==undefined){const i=+d.pick,M=S.cmode;if(S.reveal||(S.pending&&!M))return;S.move=null;
  if(M&&(M.type!=="bonus"||M.card==="surpresa"))return;
  if(M&&M.card==="mesma"&&S.pool[i].pos!==M.pos)return;
  if(!M&&!controls(turn()))return;
  S.sel=S.sel===i?null:i}
 else if(d.slot!==undefined){const t=d.team,i=+d.slot,M=S.cmode,bonus=M&&M.type==="bonus";
  if(S.reveal||S.sel===null||S.lineup[t][i]!==null||!controls(t))return;
  if(bonus?M.t!==t:(M||S.pending||turn()!==t))return;
  const pk=S.sel;S.sel=null;S.filter="ALL";
  if(bonus){S.cmode=null;place(t,pk,i,M.card)}else place(t,pk,i,null);
  commit()}
 else if(d.mv!==undefined){const t=d.team,i=+d.mv;if(!canArrange(t))return;
  if(!S.move){if(S.lineup[t][i]===null)return;S.move={t,i}}
  else if(S.move.t!==t||S.move.i===i){S.move=null}
  else{const a=S.move.i,L=S.lineup[t];[L[a],L[i]]=[L[i],L[a]];S.move=null;S.history=[];S.lastFill={t,i};
   commitArrange(t)}}
 else if(d.swap!==undefined){const M=S.cmode,i=+d.swap;if(!M||M.type!=="troca")return;
  if(M.step===0){M.mine=i;M.step=1}else{S.cmode=null;doSwap(M.t,M.mine,i);commit("both")}}
 else if(d.gk!==undefined){const M=S.cmode;if(!M||M.type!=="goleiro")return;S.cmode=null;doGoleiro(M.t,M.list[+d.gk]);commit()}
 else if(d.use){if(S.pending===d.use&&!S.cmode&&controls(d.use)){S.reveal=d.use;S.peek=true}}
 else if(d.peek){if(!S.cmode&&!S.reveal&&controls(d.peek)){S.reveal=d.peek;S.peek=false}}
 else if(d.mvote){muralVote(d.id,d.mvote);return}
 else if(d.vote){if(S.play==="online"){if(!ME||!DB)return;S.vmap={...(S.vmap||{}),[ME]:d.vote};const ref=DB.doc("rooms/"+S.room);
   writeQ=writeQ.then(()=>ref.update({vmap:{[ME]:d.vote}})).catch(()=>{S.net="Não deu para registrar o voto.";render()})}
  else S.votes[d.vote]++}
 else if(act){const A={
  home(){S.screen="home";S.net=null;try{if(location.hash.startsWith("#mural"))history.replaceState(null,"",location.pathname+location.search)}catch(e){}},
  mural(){S.net=null;openMural(null);return "norender"},
  publish(){publishMural();return "norender"},
  mcopy(){const id=d.id,u=muralLink(id);MUR.copied=id;try{navigator.clipboard.writeText(u).then(()=>render(),()=>{b.textContent=u})}catch(e){b.textContent=u}return "norender"},
  toJoin(){S.screen="join";S.joinErr=null},
  join(){joinRoom()},
  rejoin(){const s=lsGet();if(!s)return;S.play="online";S.room=s.code;S.seat=s.seat;subscribe(s.code)},
  random(){const ids=SQUADS.map(s=>s.id);let pick=[];for(let tries=0;tries<50;tries++){pick=[];while(pick.length<2){const r=ids[Math.floor(Math.random()*ids.length)];
   const nm=SQUADS.find(s=>s.id===r).n;if(!pick.some(p=>SQUADS.find(s=>s.id===p).n===nm))pick.push(r)}S.selected=pick;if(poolSize()>=22)break}
   S.comp=SQUADS.find(s=>s.id===pick[0]).c[0]},
  setupGo(){if(S.play==="online"){
    if(S.hostEditing){S.hostEditing=false;Object.assign(S,gameReset());S.screen="start";commit("both")}
    else createRoom();return}
   Object.assign(S,gameReset());S.screen="start"},
  cancelEdit(){S.hostEditing=false;subscribe(S.room)},
  lobbyGo(){S.poi={step:0,choice:null,numA:null,numB:null};S.coin=null;S.screen="start";commit()},
  copyCode(){const c=S.room;try{navigator.clipboard.writeText(c).then(()=>{b.textContent="Copiado!"},()=>{b.textContent=c})}catch(e){b.textContent=c}return "norender"},
  leave(){leaveRoom()},
  back(){S.screen="setup"},
  coin(){S.coin=Math.random()<.5?"A":"B";commit()},
  startDraft(){S.first=d.first;startDraft();commit("both")},
  undo(){if(S.cmode||S.play!=="local")return;const h=S.history.pop();if(!h)return;S.lineup[h.t][h.i]=null;S.pool[h.pk].taken=null;S.picks--;S.sel=null},
  keep(){},
  flip(){S.peek=true;S.cards[S.reveal].seen=true},
  useNow(){const r=S.reveal;S.reveal=null;S.peek=false;if(S.pending===r)useCard(r)},
  cancelMove(){S.move=null},
  cancelMode(){},
  restart(){S.screen="setup"},
  toVote(){S.screen="vote";window.scrollTo({top:0});if(S.play==="online")commit()},
  backDraft(){S.screen="draft";S.closed=false},
  close(){S.closed=true;commit()},
  zero(){S.votes={A:0,B:0}},
  again(){if(S.play==="online"){S.hostEditing=true;S.screen="setup";return}Object.assign(S,gameReset());S.screen="setup"}
 };const r=A[act]?.();if(r==="norender")return}
 else return;
 render();
});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset.name){S.names[el.dataset.name]=el.value||(el.dataset.name==="A"?"Time Ouro":"Time Prata")}
 if(el.id==="joinCode"){el.value=el.value.toUpperCase().replace(/[^A-Z]/g,"")}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.form){S.form[el.dataset.form]=el.value;render()}
 if(el.dataset.fchange){const t=el.dataset.fchange;if(!canArrange(t))return render();changeForm(t,el.value);commitArrange(t);render()}});

async function connect(){
 try{
  if(!window.claude||!window.claude.use){STANDALONE=true;
   if(window.mqtt){DB=mqttDB;ME=myId();CANWRITE=true;S.dbState="on";if(S.play==="online"&&S.room)subscribe(S.room)}else S.dbState="off";
   return render()}
  DB=await window.claude.use("db");USER=await window.claude.use("user");
  ME=USER?await USER.id():null;CANWRITE=USER?await USER.can("data.write"):null;
  S.dbState=DB&&ME&&CANWRITE!==false?"on":"off";
  if(S.play==="online"&&S.room&&S.dbState==="on")subscribe(S.room);
 }catch(e){S.dbState="off"}
 render();
}
function start(data){S=data&&data.S?data.S:fresh();S.dbState=S.dbState||"wait";render();
 connect().then(()=>{const m=(location.hash||"").match(/^#mural-([a-z0-9]+)$/);if(m)openMural(m[1])})}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
